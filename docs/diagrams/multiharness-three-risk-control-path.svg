<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">MultiHarness control path and banking route evidence</title><desc id="desc">An authorized user task enters guardrails, executes bounded tools in a private workspace, passes result verification, and returns through an authenticated output route. The three risks are external leakage, damage or excessive access, and result exposure.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#375574"/></marker></defs><rect width="1200" height="530" rx="18" fill="#f0f5fa"/><g font-family="Arial,sans-serif" fill="#173047"><text x="35" y="48" font-size="26" font-weight="bold">MultiHarness control path</text><text x="35" y="80" font-size="17">Architecture and intended boundaries; feature-level evidence establishes observed enforcement.</text></g><g fill="white" stroke="#8ca9c0" stroke-width="2"><rect x="30" y="125" width="200" height="100" rx="12"/><rect x="265" y="125" width="200" height="100" rx="12"/><rect x="500" y="125" width="200" height="100" rx="12"/><rect x="735" y="125" width="200" height="100" rx="12"/><rect x="970" y="125" width="200" height="100" rx="12"/></g><g font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173047"><text x="130" y="164">Authorized</text><text x="130" y="193">user task</text><text x="365" y="164">Input and policy</text><text x="365" y="193">guardrails</text><text x="600" y="164">Bounded tools</text><text x="600" y="193">private workspace</text><text x="835" y="164">Result checks</text><text x="835" y="193">and verification</text><text x="1070" y="164">Authenticated</text><text x="1070" y="193">output route</text></g><g stroke="#375574" stroke-width="3" marker-end="url(#arrow)"><path d="M232 175H260"/><path d="M467 175H495"/><path d="M702 175H730"/><path d="M937 175H965"/></g><g font-family="Arial,sans-serif" fill="#173047"><rect x="30" y="275" width="1140" height="62" rx="10" fill="#dbeaf6"/><text x="48" y="302" font-size="20" font-weight="bold">1 Prevent external leakage</text><text x="48" y="326" font-size="17">Approved network, dependency, model and data-transfer boundaries.</text><rect x="30" y="350" width="1140" height="62" rx="10" fill="#e0eee5"/><text x="48" y="377" font-size="20" font-weight="bold">2 Prevent damage or excessive access</text><text x="48" y="401" font-size="17">Task identity, tool and credential scope, approvals, write limits and resource bounds.</text><rect x="30" y="425" width="1140" height="62" rx="10" fill="#eee4f6"/><text x="48" y="452" font-size="20" font-weight="bold">3 Keep results contained</text><text x="48" y="476" font-size="17">Private state and artifacts, authenticated delivery, audience controls and attributable evidence.</text></g><rect x="0" y="530" width="1200" height="590" fill="#f0f5fa"/><g font-family="Arial,sans-serif" fill="#173047"><text x="35" y="565" font-size="25" font-weight="bold">Banking: designed dispatch and observed evidence</text><text x="35" y="593" font-size="17">11 Nov 2026 ICT: 0 of 3 completed numerical results; no ranking. Solid arrows show the intended protocol.</text><rect x="390" y="615" width="420" height="60" rx="10" fill="white" stroke="#375574"/><text x="600" y="642" text-anchor="middle" font-size="20">DSH web: common frozen task + inputs</text><text x="600" y="663" text-anchor="middle" font-size="16">Separate projects, task budgets and evidence</text></g><g stroke="#375574" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M600 677V690H210V710"/><path d="M600 677V710"/><path d="M600 677V690H990V710"/></g><g font-family="Arial,sans-serif" fill="#173047"><g fill="white" stroke="#8ca9c0"><rect x="35" y="715" width="350" height="120" rx="10"/><rect x="425" y="715" width="350" height="120" rx="10"/><rect x="815" y="715" width="350" height="120" rx="10"/></g><g text-anchor="middle"><text x="210" y="744" font-size="21" font-weight="bold">Claude Code</text><text x="210" y="771" font-size="17">Original web: failed, exit 1</text><text x="210" y="794" font-size="17">CLI diagnostics: protocol deviation</text><text x="210" y="817" font-size="17">Partial source; no validated report</text><text x="600" y="744" font-size="21" font-weight="bold">Deep Agents</text><text x="600" y="771" font-size="17">Latest web: exit 0, BLOCKED</text><text x="600" y="794" font-size="17">19 requests; no numerical output</text><text x="600" y="817" font-size="17">Received-prompt copy missing</text><text x="990" y="744" font-size="21" font-weight="bold">Genuine DSH Python SDK</text><text x="990" y="771" font-size="17">Banking NOT RUN</text><text x="990" y="794" font-size="17">Strict qualification unresolved</text><text x="990" y="817" font-size="17">No adapter substitution</text></g></g><g stroke="#375574" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M210 837V862H600V880"/><path d="M600 837V880"/><path d="M990 837V862H600"/></g><g font-family="Arial,sans-serif" fill="#173047"><rect x="170" y="885" width="860" height="65" rx="10" fill="#dbeaf6"/><text x="600" y="911" text-anchor="middle" font-size="20">Original operator exports: prompts, visible output, events, artifacts + hashes</text><text x="600" y="935" text-anchor="middle" font-size="17">Retain missing evidence honestly; no fabricated SDK export or recovered CLI stdout</text><rect x="170" y="970" width="860" height="65" rx="10" fill="#e0eee5"/><text x="600" y="997" text-anchor="middle" font-size="20">C4 independent frozen-rubric assessment → C8 four-page report</text><text x="600" y="1020" text-anchor="middle" font-size="17">Source → project pipeline → served-body readback; publication does not prove agent success</text><text x="35" y="1070" font-size="17">Diagram records intended boundaries and retained attempts; it does not certify live enforcement or SDK acceptance.</text><text x="35" y="1097" font-size="17">The earlier generic control path above is preserved; task/tool repair and authorization precede any new run.</text></g></svg>