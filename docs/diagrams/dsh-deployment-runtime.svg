<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deployment, containers, three agents and inference" viewBox="0 0 1120 1000"><title>Deployment, containers, three agents and inference</title><desc>Two governing references plus source relationships. No current active Pod or universal sidecar topology is asserted.</desc><defs><marker id="edge-deployment" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486a83"/></marker></defs><g font-family="system-ui,sans-serif" font-size="15" fill="#172b40"><rect x="20" y="20" width="220" height="118" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="32" y="46">Browser / authenticated</text><text x="32" y="69">owner</text><text x="32" y="92">Web chat, terminal, app</text><text x="32" y="115">links</text><rect x="330" y="20" width="260" height="72" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="342" y="46">dsh-gateway</text><text x="342" y="69">Login, owner route, manual</text><rect x="800" y="20" width="300" height="72" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="812" y="46">Controller / provisioner</text><text x="812" y="69">Pod lifecycle, capacity policy</text><path d="M240 60H328" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><path d="M590 60H798" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><rect x="20" y="150" width="1080" height="370" rx="10" fill="#f5f8fb" stroke="#64748b" stroke-dasharray="7 5"/><text x="35" y="178">Per-owner workspace/profile boundary — shared Pod network; placement depends on exact image and overlay</text><rect x="40" y="205" width="220" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="52" y="231">DSH web / terminal</text><text x="52" y="254">Owner entry and task</text><text x="52" y="277">context</text><rect x="330" y="205" width="215" height="72" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="342" y="231">DSH Python SDK</text><text x="342" y="254">Managed execution route</text><rect x="595" y="205" width="215" height="72" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="607" y="231">Claude Code</text><text x="607" y="254">Managed client route</text><rect x="860" y="205" width="215" height="72" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="872" y="231">Deep Agents</text><text x="872" y="254">Managed client route</text><path d="M460 100V200" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><path d="M260 245H328" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><rect x="40" y="365" width="220" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="52" y="391">Jupyter / arbitrary code</text><text x="52" y="414">Same authority as its</text><text x="52" y="437">UID</text><rect x="330" y="365" width="215" height="72" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="342" y="391">Application processes</text><text x="342" y="414">Sidecar not universal</text><rect x="595" y="365" width="215" height="118" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="607" y="391">Local files / tools</text><text x="607" y="414">A2A / optional</text><text x="607" y="437">OpenShell</text><text x="607" y="460">Source-bound authority</text><rect x="860" y="365" width="215" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="872" y="391">PVC state / workspace</text><text x="872" y="414">History files, not</text><text x="872" y="437">kernel RAM</text><path d="M437 280V310H570V565" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><path d="M702 280V310H570" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><path d="M967 280V310H570" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><path d="M150 445V480H570V565" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><rect x="330" y="570" width="480" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="342" y="596">Managed inference path</text><text x="342" y="619">litellm-gateway / context-forwarder</text><text x="342" y="642">Context/output admission (target)</text><rect x="330" y="715" width="480" height="72" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="342" y="741">deepinfer-dspark / DeepSeek backend</text><text x="342" y="764">sglang-dspark is a separately owned execution role</text><path d="M570 670V713" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><rect x="20" y="845" width="510" height="72" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="32" y="871">Controlled connectors → SQL/JDBC, Spark/Livy, HDFS, Git</text><text x="32" y="894">Independent resource ACLs; bootstrap outside agent shell</text><rect x="590" y="845" width="510" height="72" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="602" y="871">Protected gateway / audit state</text><text x="602" y="894">Not user-workspace owned; no shared credential implied</text><text x="20" y="980">Source/reference map, not live readiness. Same UID/mount means shared access; stopped workspace is not accepted.</text><path d="M437 285V335H700V360" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><path d="M700 485V535H280V842" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><path d="M590 100H1110V820H850V842" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/><path d="M437 440V505H967V482" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-deployment)"/></g></svg>