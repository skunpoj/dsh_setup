<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc"><title id="title">MultiHarness: components, deployment boundaries and connections</title><desc id="desc">Source-configured component map with dated observations. DSH web interactive calls go to LiteLLM. Managed agent calls pass through their task guard. LiteLLM and context-forwarder share a pod. DeepInfer and SGLang are alternative backend services, never serial hops. SDK and OpenShell qualification and current physical node placement are not inferred.</desc><defs><marker id="ui" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2366b5"/></marker><marker id="model" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#15803d"/></marker><marker id="state" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker><marker id="optional" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b7791f"/></marker></defs><rect width="1800" height="1300" fill="#fff"/><g font-family="Arial,sans-serif" fill="#153047"><text x="40" y="32" font-size="25" font-weight="700">MultiHarness: what runs where, and how it connects</text><rect x="60" y="55" width="280" height="70" rx="10" fill="#eff6ff" stroke="#9aafc3" stroke-width="2"/><text x="200.0" y="82" text-anchor="middle" font-size="18" font-weight="700">User browser</text><text x="200.0" y="106" text-anchor="middle" font-size="16">DSH web and managed-task UI</text><rect x="420" y="55" width="250" height="70" rx="10" fill="#eff6ff" stroke="#9aafc3" stroke-width="2"/><text x="545.0" y="82" text-anchor="middle" font-size="18" font-weight="700">HTTPS ingress</text><text x="545.0" y="106" text-anchor="middle" font-size="16">session / application traffic</text><rect x="760" y="55" width="300" height="70" rx="10" fill="#f8fafc" stroke="#9aafc3" stroke-width="2"/><text x="910.0" y="82" text-anchor="middle" font-size="18" font-weight="700">Identity provider</text><text x="910.0" y="106" text-anchor="middle" font-size="16">configured local auth / AD-LDAP</text><rect x="1160" y="55" width="580" height="70" rx="10" fill="#f8fafc" stroke="#9aafc3" stroke-width="2"/><text x="1450.0" y="82" text-anchor="middle" font-size="18" font-weight="700">Release plane</text><text x="1450.0" y="106" text-anchor="middle" font-size="16">AzDO main → project pipeline → images / docs artifacts</text><path d="M340 90 H420" fill="none" stroke="#2366b5" stroke-width="2.6" marker-end="url(#ui)"/><path d="M545 125 V155 H210 V250" fill="none" stroke="#2366b5" stroke-width="2.6" marker-end="url(#ui)"/><text x="215" y="151" fill="#2366b5" font-size="14">authenticated routing</text><path d="M760 90 H720 V165 H335 V250" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#state)" stroke-dasharray="7 5"/><text x="365" y="160" fill="#64748b" font-size="14">identity / entitlement checks</text><text x="45" y="47" font-size="12">Blue: UI/control   Green: model API   Grey: state/operations   Amber dashed: optional or unqualified</text><rect x="25" y="185" width="1750" height="945" rx="14" fill="#f8fafc" stroke="#526b83" stroke-width="2"/><text x="45" y="211" font-size="18" font-weight="700">RKE2 cluster • configured service namespace llm • exact current node placement not bound by this map</text><rect x="60" y="250" width="300" height="110" rx="10" fill="#e8f0fc" stroke="#9aafc3" stroke-width="2"/><text x="210.0" y="277" text-anchor="middle" font-size="18" font-weight="700">DSH gateway</text><text x="210.0" y="301" text-anchor="middle" font-size="16">dsh-gateway Service :3080</text><text x="210.0" y="323" text-anchor="middle" font-size="16">auth, routing, policy, manual pages</text><rect x="60" y="410" width="300" height="85" rx="10" fill="#eef2f7" stroke="#9aafc3" stroke-width="2"/><text x="210.0" y="437" text-anchor="middle" font-size="18" font-weight="700">Central manual / media</text><text x="210.0" y="461" text-anchor="middle" font-size="16">served by gateway /manual</text><text x="210.0" y="483" text-anchor="middle" font-size="16">versioned documentation assets</text><rect x="60" y="550" width="300" height="155" rx="10" fill="#eef2f7" stroke="#9aafc3" stroke-width="2"/><text x="210.0" y="577" text-anchor="middle" font-size="18" font-weight="700">Persistent state / evidence</text><text x="210.0" y="601" text-anchor="middle" font-size="16">auth and user settings</text><text x="210.0" y="623" text-anchor="middle" font-size="16">workspace / state volumes</text><text x="210.0" y="645" text-anchor="middle" font-size="16">receipts, logs and exported evidence</text><rect x="60" y="760" width="300" height="85" rx="10" fill="#eef2f7" stroke="#9aafc3" stroke-width="2"/><text x="210.0" y="787" text-anchor="middle" font-size="18" font-weight="700">Capacity control</text><text x="210.0" y="811" text-anchor="middle" font-size="16">admission, demand, start / stop</text><text x="210.0" y="833" text-anchor="middle" font-size="16">control plane; no model traffic</text><rect x="60" y="930" width="300" height="95" rx="10" fill="#fff8e8" stroke="#b7791f" stroke-width="2" stroke-dasharray="7 5"/><text x="210.0" y="957" text-anchor="middle" font-size="18" font-weight="700">Optional OpenShell backend</text><text x="210.0" y="981" text-anchor="middle" font-size="16">separate execution boundary</text><text x="210.0" y="1003" text-anchor="middle" font-size="16">qualification / admission required</text><rect x="420" y="250" width="650" height="570" rx="12" fill="#edf5ff" stroke="#81a9d3"/><text x="440" y="278" font-size="18" font-weight="700">Per-user workspace pod • configured in llm</text><rect x="455" y="315" width="230" height="85" rx="10" fill="#fff" stroke="#9aafc3" stroke-width="2"/><text x="570.0" y="342" text-anchor="middle" font-size="18" font-weight="700">DSH web / clients</text><text x="570.0" y="366" text-anchor="middle" font-size="16">interactive user sessions</text><text x="570.0" y="388" text-anchor="middle" font-size="16">configured model client route</text><rect x="745" y="315" width="285" height="85" rx="10" fill="#fff" stroke="#9aafc3" stroke-width="2"/><text x="887.5" y="342" text-anchor="middle" font-size="18" font-weight="700">Task broker :7682</text><text x="887.5" y="366" text-anchor="middle" font-size="16">managed runtime / write scope</text><text x="887.5" y="388" text-anchor="middle" font-size="16">lifecycle and request allowance</text><rect x="455" y="475" width="230" height="85" rx="10" fill="#fff" stroke="#9aafc3" stroke-width="2"/><text x="570.0" y="502" text-anchor="middle" font-size="18" font-weight="700">Claude Code</text><text x="570.0" y="526" text-anchor="middle" font-size="16">admitted unattended task</text><rect x="745" y="475" width="285" height="85" rx="10" fill="#fff" stroke="#9aafc3" stroke-width="2"/><text x="887.5" y="502" text-anchor="middle" font-size="18" font-weight="700">Deep Agents</text><text x="887.5" y="526" text-anchor="middle" font-size="16">admitted unattended task</text><rect x="565" y="630" width="370" height="90" rx="10" fill="#eaf7ee" stroke="#69a97a" stroke-width="2"/><text x="750.0" y="657" text-anchor="middle" font-size="18" font-weight="700">Per-task model guard</text><text x="750.0" y="681" text-anchor="middle" font-size="16">task identity, quota and no-replay</text><text x="750.0" y="703" text-anchor="middle" font-size="16">loopback in this execution context</text><rect x="455" y="750" width="575" height="50" rx="10" fill="#fff" stroke="#9aafc3" stroke-width="2"/><text x="742.5" y="777" text-anchor="middle" font-size="18" font-weight="700">Terminal / tools / apps / Jupyter</text><path d="M360 300 H400 V355 H455" fill="none" stroke="#2366b5" stroke-width="2.6" marker-end="url(#ui)"/><text x="370" y="294" fill="#2366b5" font-size="14">interactive UI</text><path d="M360 335 H395 V430 H885 V400" fill="none" stroke="#2366b5" stroke-width="2.6" marker-end="url(#ui)"/><text x="430" y="425" fill="#2366b5" font-size="14">managed task API</text><path d="M885 400 V445 H570 V475" fill="none" stroke="#2366b5" stroke-width="2.6" marker-end="url(#ui)"/><path d="M885 445 V475" fill="none" stroke="#2366b5" stroke-width="2.6" marker-end="url(#ui)"/><path d="M570 560 V595 H650 V630" fill="none" stroke="#15803d" stroke-width="2.6" marker-end="url(#model)"/><path d="M885 560 V630" fill="none" stroke="#15803d" stroke-width="2.6" marker-end="url(#model)"/><text x="895" y="603" fill="#15803d" font-size="14">model calls</text><path d="M455 775 H395 V655 H360" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#state)" stroke-dasharray="7 5"/><path d="M565 680 H400 V690 H360" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#state)" stroke-dasharray="7 5"/><text x="406" y="675" fill="#64748b" font-size="14">task receipts / state</text><path d="M210 360 V410" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#state)" stroke-dasharray="7 5"/><path d="M210 495 V550" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#state)" stroke-dasharray="7 5"/><path d="M360 800 H420" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#state)" stroke-dasharray="7 5"/><text x="365" y="790" fill="#64748b" font-size="14">workspace admission</text><rect x="1120" y="250" width="270" height="570" rx="12" fill="#edf8f0" stroke="#72a989"/><text x="1135" y="278" font-size="18" font-weight="700">Shared inference gateway</text><rect x="1135" y="305" width="240" height="60" rx="10" fill="#dff1e5" stroke="#69a97a" stroke-width="2"/><text x="1255.0" y="332" text-anchor="middle" font-size="18" font-weight="700">litellm-gateway :4000</text><rect x="1135" y="395" width="240" height="305" rx="10" fill="#fff" stroke="#72a989" stroke-dasharray="4 4"/><text x="1255" y="419" text-anchor="middle" font-size="16" font-weight="700">Same LiteLLM Pod</text><rect x="1150" y="440" width="210" height="80" rx="10" fill="#f3fbf5" stroke="#9aafc3" stroke-width="2"/><text x="1255.0" y="467" text-anchor="middle" font-size="18" font-weight="700">LiteLLM</text><text x="1255.0" y="491" text-anchor="middle" font-size="16">routing, callbacks, accounting</text><rect x="1150" y="585" width="210" height="90" rx="10" fill="#f3fbf5" stroke="#9aafc3" stroke-width="2"/><text x="1255.0" y="612" text-anchor="middle" font-size="18" font-weight="700">context-forwarder</text><text x="1255.0" y="636" text-anchor="middle" font-size="16">loopback :4001 in THIS pod</text><text x="1255.0" y="658" text-anchor="middle" font-size="16">final-wire/context admission</text><path d="M1255 365 V440" fill="none" stroke="#15803d" stroke-width="2.6" marker-end="url(#model)"/><path d="M1255 520 V585" fill="none" stroke="#15803d" stroke-width="2.6" marker-end="url(#model)"/><text x="1143" y="554" fill="#15803d" font-size="14">configured provider route</text><rect x="1140" y="745" width="230" height="55" rx="10" fill="#eef2f7" stroke="#9aafc3" stroke-width="2"/><text x="1255.0" y="772" text-anchor="middle" font-size="18" font-weight="700">PostgreSQL metadata</text><path d="M1360 480 H1380 V770 H1370" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#state)" stroke-dasharray="7 5"/><path d="M685 355 H710 V230 H1255 V305" fill="none" stroke="#15803d" stroke-width="2.6" marker-end="url(#model)"/><text x="730" y="240" fill="#15803d" font-size="14">interactive model API • direct configured route</text><path d="M935 675 H1095 V340 H1135" fill="none" stroke="#15803d" stroke-width="2.6" marker-end="url(#model)"/><text x="940" y="663" fill="#15803d" font-size="14">guarded model API</text><rect x="420" y="865" width="650" height="190" rx="12" fill="#fff8e8" stroke="#b7791f" stroke-dasharray="7 5"/><text x="440" y="893" font-size="17" font-weight="700">Admitted isolated worker Pod • namespace / image bound by admission</text><rect x="455" y="925" width="260" height="95" rx="10" fill="#fffaf0" stroke="#b7791f" stroke-width="2" stroke-dasharray="7 5"/><text x="585.0" y="952" text-anchor="middle" font-size="18" font-weight="700">Native SDK task worker</text><text x="585.0" y="976" text-anchor="middle" font-size="16">official native route</text><text x="585.0" y="998" text-anchor="middle" font-size="16">qualification not assumed</text><rect x="760" y="925" width="270" height="95" rx="10" fill="#fffaf0" stroke="#b7791f" stroke-width="2" stroke-dasharray="7 5"/><text x="895.0" y="952" text-anchor="middle" font-size="18" font-weight="700">Worker model-guard</text><text x="895.0" y="976" text-anchor="middle" font-size="16">sidecar loopback :4001</text><text x="895.0" y="998" text-anchor="middle" font-size="16">NOT the LiteLLM forwarder</text><path d="M1030 355 H1080 V840 H585 V925" fill="none" stroke="#b7791f" stroke-width="2.6" marker-end="url(#optional)" stroke-dasharray="7 5"/><text x="665" y="837" fill="#b7791f" font-size="14">SDK / native admission</text><path d="M715 975 H760" fill="none" stroke="#15803d" stroke-width="2.6" marker-end="url(#model)" stroke-dasharray="7 5"/><path d="M1030 975 H1110 V350 H1135" fill="none" stroke="#15803d" stroke-width="2.6" marker-end="url(#model)" stroke-dasharray="7 5"/><path d="M1080 840 V1090 H210 V1025" fill="none" stroke="#b7791f" stroke-width="2.6" marker-end="url(#optional)" stroke-dasharray="7 5"/><rect x="1430" y="250" width="320" height="805" rx="12" fill="#f5f0ff" stroke="#9a87bd"/><text x="1450" y="280" font-size="18" font-weight="700">Model / GPU serving tier</text><rect x="1450" y="340" width="280" height="165" rx="10" fill="#f7f2ff" stroke="#9a87bd" stroke-width="2"/><text x="1590.0" y="367" text-anchor="middle" font-size="18" font-weight="700">deepinfer-dspark :8000</text><text x="1590.0" y="391" text-anchor="middle" font-size="16">DeepInfer selector</text><text x="1590.0" y="413" text-anchor="middle" font-size="16">primary intended / retained route</text><text x="1590.0" y="435" text-anchor="middle" font-size="16">tokenize + completion: SAME base</text><text x="1590.0" y="457" text-anchor="middle" font-size="16">fresh endpoints not verified</text><rect x="1450" y="675" width="280" height="140" rx="10" fill="#fff8e8" stroke="#b7791f" stroke-width="2" stroke-dasharray="7 5"/><text x="1590.0" y="702" text-anchor="middle" font-size="18" font-weight="700">sglang-dspark :8000</text><text x="1590.0" y="726" text-anchor="middle" font-size="16">SGLang selector</text><text x="1590.0" y="748" text-anchor="middle" font-size="16">rollback ALTERNATIVE</text><text x="1590.0" y="770" text-anchor="middle" font-size="16">not a hop after DeepInfer</text><rect x="1450" y="930" width="280" height="95" rx="10" fill="#f8fafc" stroke="#9aafc3" stroke-width="2"/><text x="1590.0" y="957" text-anchor="middle" font-size="18" font-weight="700">Physical GPU / node</text><text x="1590.0" y="981" text-anchor="middle" font-size="16">historical host receipts exist</text><text x="1590.0" y="1003" text-anchor="middle" font-size="16">current placement unverified</text><path d="M1360 625 H1410 V422 H1450" fill="none" stroke="#15803d" stroke-width="2.6" marker-end="url(#model)"/><text x="1386" y="580" fill="#15803d" font-size="14">selected engine origin</text><path d="M1360 650 H1418 V745 H1450" fill="none" stroke="#b7791f" stroke-width="2.6" marker-end="url(#optional)" stroke-dasharray="7 5"/><text x="1428" y="641" fill="#b7791f" font-size="14">explicit backend switch only</text><text x="435" y="1118" font-size="15">Persistent workspace state and exported worker evidence differ from ephemeral process / worker state.</text><rect x="60" y="1170" width="1680" height="95" rx="10" fill="#f1f5f9" stroke="#9aafc3" stroke-width="2"/><text x="900.0" y="1197" text-anchor="middle" font-size="18" font-weight="700">Reading this map</text><text x="900.0" y="1221" text-anchor="middle" font-size="16">Configured topology + dated operator observations; this is not a current all-component runtime acceptance receipt.</text><text x="900.0" y="1243" text-anchor="middle" font-size="16">DeepInfer and SGLang are alternatives. Two different pods may both use loopback :4001; they are not the same listener.</text></g></svg>
