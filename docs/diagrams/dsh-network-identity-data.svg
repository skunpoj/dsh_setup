<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network, identity, credentials, data and persistence boundaries" viewBox="0 0 1120 1000"><title>Network, identity, credentials, data and persistence boundaries</title><desc>Internal and customizable cloud policies differ. Kerberos historical references do not establish current identity or isolation.</desc><defs><marker id="edge-network" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486a83"/></marker></defs><g font-family="system-ui,sans-serif" font-size="15" fill="#172b40"><rect x="20" y="20" width="1080" height="72" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="32" y="46">Policy / human → Harness / deterministic → Infrastructure / resource authorization</text><text x="32" y="69">Audit/evidence spans all three; CIA and leakage/damage/exposure remain objectives</text><rect x="20" y="155" width="330" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="32" y="181">On-prem Internal</text><text x="32" y="204">Approved internal routes</text><text x="32" y="227">DeepSeek/LiteLLM + 393216 target</text><rect x="395" y="155" width="330" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="407" y="181">On-prem Internet-enabled</text><text x="407" y="204">Same enterprise provider restriction</text><text x="407" y="227">Broad HTTPS bypass unqualified</text><rect x="770" y="155" width="330" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="782" y="181">Customizable cloud / arena</text><text x="782" y="204">Explicit provider and billing choice</text><text x="782" y="227">Free default not yet verified</text><path d="M185 255V320H480V355" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-network)"/><path d="M560 255V355" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-network)"/><path d="M935 255V320H635V355" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-network)"/><rect x="300" y="360" width="520" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="312" y="386">Actual workload boundary</text><text x="312" y="409">DSH / SDK / Claude / Deep Agents / Jupyter</text><text x="312" y="432">UID, mounts, environment and effective NetworkPolicy</text><rect x="20" y="550" width="330" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="32" y="576">Login identity / task owner</text><text x="32" y="599">AD/LDAP is not kinit</text><text x="32" y="622">No passwords in agent prompts</text><rect x="395" y="550" width="330" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="407" y="576">Managed model ingress</text><text x="407" y="599">LiteLLM / context-forwarder</text><text x="407" y="622">Not data-resource authorization</text><rect x="770" y="550" width="330" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="782" y="576">Network and resource control</text><text x="782" y="599">Namespace/RBAC, quotas, PVC ACL</text><text x="782" y="622">Actual selector/traffic tests pending</text><path d="M480 460V500H185V545" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-network)"/><path d="M560 460V545" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-network)"/><path d="M635 460V500H935V545" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-network)"/><rect x="20" y="740" width="510" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="32" y="766">Kerberos bootstrap / delegated resource identity</text><text x="32" y="789">Historical FILE:/state/kerberos/ccache, sessions 631–632</text><text x="32" y="812">Current kinit/klist, renewal and cross-user proof absent</text><rect x="590" y="740" width="510" height="95" rx="8" fill="#eaf2fa" stroke="#486a83"/><text x="602" y="766">SQL/JDBC, Spark/Livy and raw HDFS</text><text x="602" y="789">Resource ACLs apply independently on every route</text><text x="602" y="812">Same-UID code can access the same mounted credentials</text><path d="M185 650V735" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-network)"/><path d="M935 650V735" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-network)"/><path d="M530 790H588" fill="none" stroke="#486a83" stroke-width="2" marker-end="url(#edge-network)"/><text x="20" y="945">Saved files/history ≠ live kernel/task/session. Separate credential caches, namespaces and mount checks need receipts.</text><text x="20" y="978">Blue boxes describe source/design roles; no color certifies current enforcement or remote resource entitlement.</text></g></svg>