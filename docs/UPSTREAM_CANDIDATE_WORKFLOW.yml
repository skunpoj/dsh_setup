name: DSH upstream candidate
on:
  push:
    branches: [main]
    paths: [.github/workflows/upstream-candidate.yml, Dockerfile, .dockerignore, 'scripts/**', 'tests/**', 'container/**', 'vendor/**', 'patches/**', 'config/**', 'plugins/**', 'k8s/**', 'package*.json', '*requirements*.txt', '*lock*', .gitattributes]
  pull_request:
    paths: [.github/workflows/upstream-candidate.yml, Dockerfile, .dockerignore, 'scripts/**', 'tests/**', 'container/**', 'vendor/**', 'patches/**', 'config/**', 'plugins/**', 'k8s/**', 'package*.json', '*requirements*.txt', '*lock*', .gitattributes]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Optional explicit preview version; empty tracks npm latest
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: dsh-upstream-${{ github.event.pull_request.number || 'candidate' }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate: ${{ steps.detect.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Detect official release and validate input
        id: detect
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence
          python3 -m unittest discover -s tests -p 'test_upstream*.py'
          # Push/PR CI must qualify the checked-out package pin, not an
          # unrelated new npm release whose patch contracts need review.
          args=(--event "$EVENT_NAME")
          if [ -n "$CANDIDATE_VERSION" ]; then args+=(--candidate "$CANDIDATE_VERSION"); fi
          python3 scripts/check_upstream.py --output candidate-evidence/upstream.json --source-diff candidate-evidence/source-diff.json "${args[@]}"
          python3 - <<'PY'
          import json,os
          d=json.load(open('candidate-evidence/upstream.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('candidate='+d['candidateVersion']+'\n')
              f.write('needs_update='+str(d['candidateChangeRequired']).lower()+'\n')
          PY
      - name: Require reviewed compatible source before executing candidate
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('candidate-evidence/source-diff.json'))
          if not d['buildAllowed']:
              raise SystemExit(d['status']+': '+d['nextAction'])
          PY
          node tests/test_upstream_contract.js
      - name: Build candidate with reviewed upstream patch contracts
        env:
          CANDIDATE: ${{ steps.detect.outputs.candidate }}
        run: |
          set -euo pipefail
          docker build --progress=plain --build-arg "DSH_VERSION=$CANDIDATE" -t dsh-upstream-candidate . 2>&1 | tee candidate-evidence/build.log
          docker inspect --format='{"imageId":"{{.Id}}"}' dsh-upstream-candidate > candidate-evidence/image.json
      - name: Test actual installed package and disposable web runtime
        env:
          CANDIDATE: ${{ steps.detect.outputs.candidate }}
        run: |
          set -euo pipefail
          docker run --rm --network none --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges --entrypoint node -w /opt/dsh dsh-upstream-candidate scripts/verify_installed_candidate.js "$CANDIDATE" | tee candidate-evidence/installed-package.json
          docker run --rm --network none --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges --entrypoint node -w /opt/dsh dsh-upstream-candidate scripts/smoke_candidate_runtime.js | tee candidate-evidence/runtime-smoke.json
      - name: Test deployment overlays
        run: |
          set -euo pipefail
          for test in test_auth_proxy_internet test_environment_routing test_user_isolation_routing test_internal_model_catalog test_proxy_identity_headers test_upstream_contract; do
            docker run --rm --network none --entrypoint node -w /opt/dsh dsh-upstream-candidate "tests/$test.js" 2>&1 | tee "candidate-evidence/$test.log"
          done
          docker run --rm --network none --entrypoint python3 -w /opt/dsh dsh-upstream-candidate -m unittest discover -s tests -p test_package_promotion.py 2>&1 | tee candidate-evidence/package-promotion.log
          python3 -m venv /tmp/dsh-test-venv
          # The host suite also exercises a real Jupyter server/kernel. Match
          # the image's reviewed versions instead of relying on runner packages.
          lab_version=$(sed -n 's/^ARG JUPYTERLAB_VERSION=//p' Dockerfile)
          server_version=$(sed -n 's/^ARG JUPYTER_SERVER_VERSION=//p' Dockerfile)
          kernel_version=$(sed -n 's/^ARG IPYKERNEL_VERSION=//p' Dockerfile)
          /tmp/dsh-test-venv/bin/pip install PyYAML==6.0.3 "jupyterlab==$lab_version" "jupyter-server==$server_version" "ipykernel==$kernel_version"
          /tmp/dsh-test-venv/bin/python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee candidate-evidence/python-tests.log
      - name: Verify admin dashboard browser behavior
        env:
          DSH_PLAYWRIGHT: /tmp/dsh-browser/node_modules/playwright
          DSH_ADMIN_QA_OUTPUT: candidate-evidence/browser
          DSH_TEST_EVIDENCE_OUTPUT: candidate-evidence/admin-dashboard.json
        run: |
          set -euo pipefail
          npm install --prefix /tmp/dsh-browser --ignore-scripts playwright@1.62.1
          /tmp/dsh-browser/node_modules/.bin/playwright install --with-deps chromium
          node tests/test_admin_dashboard.js
      - name: Write qualification summary
        if: always()
        env:
          CANDIDATE: ${{ steps.detect.outputs.candidate }}
          RESULT: ${{ job.status }}
        run: |
          printf '## DSH candidate %s\n\nResult: %s\n\nSource: %s\n\nNo Production deployment, image publication, shared histories or model calls. A passing candidate still requires copied-state, browser/WebSocket, real compaction and infrastructure-boundary acceptance before release.\n' "$CANDIDATE" "$RESULT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain detection, image and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsh-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-evidence/
          retention-days: 30
