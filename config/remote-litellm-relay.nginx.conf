# Operator-reviewed recipe. Keep this listener behind the DSH namespace boundary.
# Supply a real trusted CA bundle and qualify the remote host before cutover.
server {
    listen 4000;
    server_name _;
    access_log off;
    client_max_body_size 64m;
    location / {
        proxy_pass https://llm.example.internal;
        proxy_http_version 1.1;
        proxy_set_header Host llm.example.internal;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_server_name on;
        proxy_ssl_name llm.example.internal;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
