name: Public source review
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test publication guard
        run: python3 -m unittest discover -s tests -p test_public_scan.py -v
      - name: Verify governed-harness comparison artifact
        run: python3 -m unittest discover -s tests -p test_governed_harness_comparison.py -v
      - name: Verify documentation rendering contracts
        run: python3 -m unittest discover -s tests -p test_document_rendering_contract.py -v
      - name: Build exact-commit consolidated manual package
        run: |
          python3 scripts/build_manual_bundle.py --git-ref "$GITHUB_SHA" --output "$RUNNER_TEMP/dsh-manual"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'dsh-manual'
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['sourceCommit'] == os.environ['GITHUB_SHA']
          assert {'index.html', 'DSH_PLATFORM_GUIDE.html'} <= manifest['files'].keys()
          for name, entry in manifest['files'].items():
              data = (root / name).read_bytes()
              assert len(data) == entry['bytes']
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
          print({'files': len(manifest['files']), 'bytes': manifest['bytes']})
          PY
      - name: Scan checked-out tree
        run: python3 scripts/scan_public.py .
      - name: Check managed-agent JavaScript policy
        run: node --input-type=module -e "const t = await import('./integrations/managed-agents/tests/test_managed_agent_policy.mjs'); if(t.default.passed !== t.default.total) process.exit(1); console.log(t.default)"
      - name: Check managed-agent Python source policy
        run: python3 -m unittest discover -s integrations/managed-agents/tests -p test_managed_deepagents.py -v
      - name: Check authenticated agent task gateway
        run: |
          node tests/test_agent_task_gateway.cjs
          node tests/test_native_sdk_approval_ui.cjs
          node tests/test_manual_route.js
      - name: Check private runtime task broker and launcher
        run: |
          python3 -m unittest discover -s tests -p test_task_broker.py -v
          python3 -m unittest discover -s tests -p test_official_sdk_approval.py -v
          python3 -m unittest discover -s tests -p test_official_sdk_session.py -v
          python3 -m unittest discover -s tests -p test_official_sdk_release_admission.py -v
          python3 -m unittest discover -s tests -p test_official_sdk_runtime_entry.py -v
          python3 -m unittest discover -s tests -p test_official_sdk_task.py -v
          python3 -m unittest discover -s tests -p test_official_sdk_isolation.py -v
          python3 -m unittest discover -s tests -p test_official_sdk_bootstrap.py -v
          python3 -m unittest discover -s tests -p test_official_sdk_deployment_observer.py -v
          python3 -m unittest discover -s tests -p test_official_sdk_test_api.py -v
          python3 -m unittest discover -s tests -p test_official_sdk_executing_identity.py -v
          python3 -m unittest discover -s tests -p test_unattended_launcher.py -v
