# Isolated verification only. Does not modify Production mounts.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dsh-da-workspace-nonroot-canary-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  mountOptions:
  - dir_mode=0770
  - file_mode=0660
  - vers=3.0
  - uid=10001
  - gid=10001
  - forceuid
  - forcegid
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: bot.or.th/cfs/FILESERV/DA_WORKSPACE/workstation#dsh-nonroot-canary-20261015#
    volumeAttributes:
      source: //bot.or.th/cfs/FILESERV/DA_WORKSPACE/workstation
    nodeStageSecretRef:
      name: cifs-smb-secret
      namespace: llm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsh-da-workspace-nonroot-canary
  namespace: llm
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ''
  volumeName: dsh-da-workspace-nonroot-canary-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dsh-da-workspace-nonroot-canary
  namespace: llm
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: dsh-maintenance
        dsh.bot.or.th/egress-mode: offline
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: probe
        image: dsoreg-sm1-p1.bot.or.th/da-gpu-server/dsh-runtime@sha256:96be6e7fad0a1d456484bacfed45612c3d3ba95290a9f59a03eb612d50a4efc1
        command:
        - python3
        - -c
        - "from pathlib import Path\nimport os,json,uuid,hashlib\nroot=Path('/share');probe=root/('.dsh-mount-check-'+uuid.uuid4().hex);payload=b'DSH_NONROOT_DA_WORKSPACE_PROBE'\n\
          result={'uid':os.getuid(),'gid':os.getgid(),'rootUID':root.stat().st_uid,'rootGID':root.stat().st_gid,'rootMode':oct(root.stat().st_mode&0o777),'filesystem':[line.split()[2]\
          \ for line in Path('/proc/mounts').read_text().splitlines() if line.split()[1]=='/share']}\n\
          try:\n with probe.open('xb') as target:target.write(payload);target.flush();os.fsync(target.fileno())\n\
          \ result['writeReadback']=probe.read_bytes()==payload;result['sha256']=hashlib.sha256(probe.read_bytes()).hexdigest()\n\
          finally:\n if probe.exists():probe.unlink()\nresult['ownProbeRemoved']=not\
          \ probe.exists();print(json.dumps(result))\n"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        volumeMounts:
        - name: central
          mountPath: /share
          subPath: dsh
      volumes:
      - name: central
        persistentVolumeClaim:
          claimName: dsh-da-workspace-nonroot-canary
