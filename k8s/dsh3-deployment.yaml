          name: dsh-legacy-auth-source-4474e8c2e0cc
      - name: audit-export-source
        configMap:
          name: dsh-legacy-audit-837e595413fb
      - name: central-legacy-audit
        persistentVolumeClaim:
          claimName: dsh-da-workspace-secure
