apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-secure
  namespace: llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dsh-secure
  template:
    metadata:
      labels:
        app: dsh-secure
        dsh.example.com/egress-mode: offline
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: dsh
        # Historic: the shared dsh-secure/dsh-internet Deployments are retired. Private dsh-u-* pairs are rendered by the capacity controller from its site template (31 Oct 2026, 08:53 UTC: dsh-runtime@sha256:2b93a01050e8282b1554a3cb77f822646f4a0da28f9df6a4bb24856384d718aa, controller site ConfigMap dsh-managed-signin-site-1f7781585688, managed-signin ConfigMap dsh-managed-signin-boot-795be06532).
        image: registry.example.internal/dsh-runtime@sha256:87bc12dd5c2419e640c11358881f01709944a259498cf38a699fcc57d037e1a3
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: DSH_ENVIRONMENT
          value: secure
        - name: DSH_TRUSTED_HOST
          value: dsh.example.invalid
        - name: DEEPSEEK_BASE_URL
          value: http://litellm-gateway.llm.svc.cluster.local:4000/v1
        - name: ANTHROPIC_BASE_URL
          value: http://litellm-gateway.llm.svc.cluster.local:4000
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: dsh-inference-admin-20261016
              key: litellm-api-key
        - name: KRB5_CONFIG
          value: /kerberos-config/krb5.conf
        ports:
        - name: web
          containerPort: 3081
        - name: terminal
          containerPort: 7681
        - name: agent-tasks
          containerPort: 7682
        startupProbe:
          exec:
            command:
            - node
            - /opt/dsh/scripts/runtime_health.js
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        readinessProbe:
          exec:
            command:
            - node
            - /opt/dsh/scripts/runtime_health.js
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - node
            - /opt/dsh/scripts/runtime_health.js
          timeoutSeconds: 3
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '4'
            memory: 8Gi
        volumeMounts:
        - name: state
          mountPath: /state
        - name: protected-workspace
          mountPath: /workspace
          subPath: dsh
        - name: protected-workspace
          mountPath: /state/sessions
          subPath: dsh/dsh_storage/sessions
        - name: protected-workspace
          mountPath: /state/attachments
          subPath: dsh/dsh_storage/attachments
        - name: protected-workspace
          mountPath: /state/storages
          subPath: dsh/dsh_storage/storages
        - name: protected-workspace
          mountPath: /state/workspaces
          subPath: dsh/dsh_storage/workspaces
        - name: protected-workspace
          mountPath: /state/logs
          subPath: dsh/dsh_storage/logs
        - name: package-cache
          mountPath: /packages/approved
          readOnly: true
        - name: routing-tokens
          mountPath: /runtime-tokens
        - mountPath: /kerberos-config
          name: kerberos-config
          readOnly: true
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: dsh-secure-state
      - name: protected-workspace
        persistentVolumeClaim:
          claimName: dsh-da-workspace-secure
      - name: routing-tokens
        persistentVolumeClaim:
          claimName: dsh-secure-token
      - name: package-cache
        persistentVolumeClaim:
          claimName: dsh-package-approved
      - configMap:
          defaultMode: 420
          name: dsh-internal-dns-369567dbcddb
        name: kerberos-config
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 192.0.2.53
        options:
        - name: ndots
          value: '1'
---
