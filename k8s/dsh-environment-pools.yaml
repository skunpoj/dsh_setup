---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-secure
  namespace: llm
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: dsh-secure }
  template:
    metadata:
      labels:
        app: dsh-secure
        dsh.bot.or.th/egress-mode: offline
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: dsh
          image: dsoreg-sm1-p1.bot.or.th/da-gpu-server/dsh-runtime@sha256:96be6e7fad0a1d456484bacfed45612c3d3ba95290a9f59a03eb612d50a4efc1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - { name: DSH_ENVIRONMENT, value: secure }
            - { name: DSH_TRUSTED_HOST, value: dsh.aiportal.bot.or.th }
            - { name: DEEPSEEK_BASE_URL, value: "http://litellm.llm.svc.cluster.local:4000/v1" }
            - name: DEEPSEEK_API_KEY
              valueFrom: { secretKeyRef: { name: dsh-runtime-secrets, key: litellm-api-key } }
          ports:
            - { name: web, containerPort: 3081 }
            - { name: terminal, containerPort: 7681 }
          startupProbe:
            exec: { command: [node, /opt/dsh/scripts/runtime_health.js] }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            exec: { command: [node, /opt/dsh/scripts/runtime_health.js] }
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: { command: [node, /opt/dsh/scripts/runtime_health.js] }
            timeoutSeconds: 3
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "4", memory: 8Gi }
          volumeMounts:
            - { name: state, mountPath: /state }
            - { name: protected-workspace, mountPath: /workspace }
            - { name: package-cache, mountPath: /packages/approved, readOnly: true }
            - { name: routing-tokens, mountPath: /runtime-tokens }
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: dsh-secure-state }
        - name: protected-workspace
          persistentVolumeClaim: { claimName: dsh-secure-workspace }
        - name: routing-tokens
          persistentVolumeClaim: { claimName: dsh-secure-token }
        - name: package-cache
          persistentVolumeClaim: { claimName: dsh-package-approved }
---
