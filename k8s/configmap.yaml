apiVersion: v1
kind: ConfigMap
metadata:
  name: dsh-scripts
  namespace: llm
data:
  auth_proxy.js: "const http = require('http');\nconst url = require('url');\nconst fs = require('fs');\nconst crypto\
    \ = require('crypto');\nconst { hashPassword, verifyPassword, migrateUsers, writeAtomicUsers } = require('./password_store');\n\
    \nconst PROXY_PORT = Number(process.env.PORT || 3080);\n// Kubernetes may inject DSH_PORT=tcp://<service-ip>:3080\
    \ for the Service named\n// \"dsh\". Accept only an explicitly numeric port and otherwise use the internal\n\
    // DSH web port, avoiding an invalid 127.0.0.1:NaN proxy target.\nconst requestedDshPort = process.env.DSH_TARGET_PORT\
    \ || process.env.DSH_PORT || '';\nconst DSH_TARGET_PORT = /^\\d+$/.test(requestedDshPort) ? Number(requestedDshPort)\
    \ : 3081;\nconst DSH_TARGET_HOST = process.env.DSH_HOST || '127.0.0.1';\nconst USER_ROOT = process.env.WORKSPACE_ROOT\
    \ || '/workspace/users';\nconst USER_STORE_PATH = process.env.DSH_USER_STORE_PATH || `${USER_ROOT}/.user_auth.json`;\n\
    const USER_SETTINGS_PATH = process.env.DSH_USER_SETTINGS_PATH || `${USER_ROOT}/.user_settings.json`;\nconst\
    \ COOKIE_NAME = process.env.DSH_COOKIE_NAME || 'dsh_auth';\nconst COOKIE_TRANSPORT = process.env.DSH_COOKIE_SECURE\
    \ === 'false' ? '' : '; Secure';\nconst ADMIN_USERS = new Set((process.env.DSH_ADMIN_USERS || 'admin').split(',').map(x\
    \ => x.trim()).filter(Boolean));\nconst ADMIN_SUMMARY_FILE = process.env.DSH_ADMIN_SUMMARY_FILE || '/admin-status/summary.json';\n\
    const AUDIT_DIR = process.env.DSH_AUDIT_DIR || `${USER_ROOT}/audit`;\nlet auditFailures = 0;\nfunction auditEvent(event,\
    \ actor, mode) {\n  try {\n    fs.mkdirSync(AUDIT_DIR, { recursive: true, mode: 0o700 });\n    const file =\
    \ `${AUDIT_DIR}/events.jsonl`;\n    if (fs.existsSync(file) && fs.statSync(file).size >= 5 * 1024 * 1024) {\n\
    \      // Preserve old records; stop rather than silently delete an audit archive.\n      if (fs.existsSync(`${AUDIT_DIR}/events.5.jsonl`))\
    \ throw new Error('Audit retention capacity reached');\n      for (let i = 4; i >= 1; i--) if (fs.existsSync(`${AUDIT_DIR}/events.${i}.jsonl`))\
    \ fs.renameSync(`${AUDIT_DIR}/events.${i}.jsonl`, `${AUDIT_DIR}/events.${i+1}.jsonl`);\n      fs.renameSync(file,\
    \ `${AUDIT_DIR}/events.1.jsonl`);\n    }\n    const user = typeof actor === 'string' && /^[a-zA-Z0-9_.-]{1,30}$/.test(actor)\
    \ ? actor : 'unidentified';\n    fs.appendFileSync(file, JSON.stringify({ time: new Date().toISOString(), event,\
    \ user,\n      environment: normalizeInternetMode(mode) === 'on' ? 'internet' : 'secure' }) + '\\n', { mode:\
    \ 0o600 });\n    return true;\n  } catch { auditFailures++; console.error('[AUDIT] Could not persist security\
    \ event'); return false; }\n}\nfunction recentAudit() {\n  const events = new Set(['login.success','login.denied','logout','runtime.http','admin.denied','terminal.open','application.websocket']);\n\
    \  const rows=[];\n  for(const file of [`${AUDIT_DIR}/events.jsonl`,`${AUDIT_DIR}/legacy/legacy-dsh2/events.jsonl`,`${AUDIT_DIR}/legacy/legacy-dsh3/events.jsonl`])\
    \ {\n    try {\n      if(fs.statSync(file).size > 8*1024*1024) continue;\n      for(const line of fs.readFileSync(file,'utf8').split('\\\
    n')) {\n        try {\n          const r=JSON.parse(line);\n          if(!events.has(r.event)||typeof r.time!=='string'||!Number.isFinite(Date.parse(r.time))||!\
    \ /^[a-zA-Z0-9_.-]{1,30}$/.test(r.user)||!['secure','internet','legacy-dsh2/internet','legacy-dsh3/internet'].includes(r.environment))\
    \ continue;\n          rows.push({time:r.time,event:r.event,user:r.user,environment:r.environment});\n     \
    \   } catch {}\n      }\n    } catch {}\n  }\n  return rows.sort((a,b)=>Date.parse(a.time)-Date.parse(b.time)).slice(-100);\n\
    }\nfunction legacyAuditStatus() {\n  const instances=[];\n  for(const name of ['legacy-dsh2','legacy-dsh3'])\
    \ {\n    try {\n      const v=JSON.parse(fs.readFileSync(`${AUDIT_DIR}/legacy/${name}/status.json`,'utf8'));\n\
    \      const r=(v.instances||[]).find(row=>row.name===name);\n      if(r&&typeof v.observedAt==='string'&&Number.isFinite(Date.parse(v.observedAt)))\
    \ instances.push({name,events:Math.max(0,Math.min(1000,Number(r.events)||0)),observedAt:v.observedAt});\n  \
    \  } catch {}\n  }\n  return {observedAt:instances.length?instances.map(r=>r.observedAt).sort()[0]:null,instances};\n\
    }\n\nfunction adminSummary() {\n  let saved = {};\n  try { saved = JSON.parse(fs.readFileSync(ADMIN_SUMMARY_FILE,\
    \ 'utf8')); } catch {}\n  const sessions = { secure: 0, internet: 0 };\n  for (const s of SESSIONS.values())\
    \ sessions[normalizeInternetMode(s.internet) === 'on' ? 'internet' : 'secure']++;\n  // Explicit projection\
    \ prevents accidental publication of credentials or raw\n  // Kubernetes configuration from an operator-supplied\
    \ snapshot.\n  return { generatedAt: new Date().toISOString(), registeredAccounts: Object.keys(loadUsers()).length,\n\
    \    activeBrowserSessions: sessions, privateUserRouting: Boolean(USER_TARGETS), registrationEnabled: ALLOW_REGISTRATION,\n\
    \    audit: { failuresSinceStart: auditFailures, recentEvents: recentAudit().length, legacy: legacyAuditStatus()\
    \ },\n    snapshot: { observedAt: typeof saved.observedAt === 'string' ? saved.observedAt : null,\n      environments:\
    \ Array.isArray(saved.environments) ? saved.environments.map(e => ({ name: String(e.name || ''),\n        ready:\
    \ e.ready === true, storage: String(e.storage || ''), network: String(e.network || '') })) : [],\n      model:\
    \ saved.model ? { backendContext: Number(saved.model.backendContext) || null,\n        userContext: Number(saved.model.userContext)\
    \ || null, concurrencyCeiling: Number(saved.model.concurrencyCeiling) || null } : null,\n      performance:\
    \ Array.isArray(saved.performance) ? saved.performance.map(String) : [],\n      gaps: Array.isArray(saved.gaps)\
    \ ? saved.gaps.map(String) : [] } };\n}\n\nfunction renderAdminDashboard() {\n  return `<!doctype html><html\
    \ lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\
    ><title>DSH Admin overview</title>\n<style>body{font:16px/1.6 system-ui;background:#f1f5f9;color:#172033;margin:0}main{max-width:1100px;margin:auto;padding:32px}a{color:#075985}header{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}section{background:white;border:1px\
    \ solid #cbd5e1;border-radius:12px;padding:20px;margin:18px 0}h1,h2{line-height:1.2}strong{font-size:24px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px\
    \ solid #e2e8f0}.muted{color:#475569}.notice{border-left:5px solid #d97706}button{padding:8px 16px;cursor:pointer}</style>\n\
    <main><header><h1>DSH Admin overview</h1><a href=\"/\">Back to DSH</a><a href=\"/logout\">Logout</a><button\
    \ id=\"refresh\">Refresh</button></header><p id=\"error\" role=\"alert\"></p><p id=\"time\" class=\"muted\"\
    ></p>\n<div class=\"cards\"><section>Registered accounts<br><strong id=\"accounts\">—</strong></section><section>Main\
    \ gateway browser sessions<br><strong id=\"sessions\">—</strong><div id=\"sessionDetail\"></div></section><section>User\
    \ routing<br><strong id=\"routing\">—</strong></section></div>\n<section class=\"notice\"><h2>Evidence freshness</h2><p\
    \ id=\"freshness\"></p><p>Account/session counts and routing are current gateway values. Environment health,\
    \ storage, limits and performance below are an operator-recorded snapshot, not live monitoring. Browser logins\
    \ are not unique users or model requests.</p></section>\n<section><h2>Execution environments</h2><div style=\"\
    overflow:auto\"><table><thead><tr><th>Environment</th><th>Recorded readiness</th><th>Storage</th><th>Recorded\
    \ network behavior</th></tr></thead><tbody id=\"environments\"></tbody></table></div></section>\n<section><h2>Model\
    \ limits</h2><p id=\"model\"></p><p class=\"muted\">A concurrency ceiling does not guarantee that many maximum-length\
    \ requests fit.</p></section><section><h2>Recorded performance</h2><ul id=\"performance\"></ul></section><section><h2>Central\
    \ access audit</h2><p id=\"audit\"></p><a href=\"/api/admin/audit\">Read recent access events</a></section><section\
    \ class=\"notice\"><h2>Remaining controls</h2><ul id=\"gaps\"></ul></section><p class=\"muted\">Read-only overview.\
    \ No passwords, cookies, conversation contents or source records are displayed.</p></main>\n<script>\nconst\
    \ put=(id,value)=>document.getElementById(id).textContent=value;\nfunction list(id,values){const root=document.getElementById(id);root.replaceChildren();for(const\
    \ value of values){const li=document.createElement('li');li.textContent=value;root.append(li);}}\nasync function\
    \ refresh(){try{const r=await fetch('/api/admin/summary',{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw\
    \ Error('Admin access unavailable ('+r.status+').');const d=await r.json();put('error','');put('time','Gateway\
    \ read at '+d.generatedAt);put('accounts',d.registeredAccounts);put('sessions',d.activeBrowserSessions.secure+d.activeBrowserSessions.internet);put('sessionDetail','No\
    \ Internet: '+d.activeBrowserSessions.secure+' · Internet: '+d.activeBrowserSessions.internet);put('routing',d.privateUserRouting?'Per\
    \ user':'Shared pools');put('freshness',d.snapshot.observedAt?'Snapshot observed at '+d.snapshot.observedAt+'.\
    \ Refresh does not rerun infrastructure tests.':'No snapshot available. Infrastructure status is unknown.');const\
    \ root=document.getElementById('environments');root.replaceChildren();for(const e of d.snapshot.environments){const\
    \ tr=document.createElement('tr');for(const text of [e.name,e.ready?'Ready at observation':'Not verified ready',e.storage,e.network]){const\
    \ td=document.createElement('td');td.textContent=text;tr.append(td);}root.append(tr);}const m=d.snapshot.model;put('model',m?'Backend\
    \ context: '+m.backendContext+' tokens · DSH/LiteLLM budget: '+m.userContext+' tokens · Running-request ceiling:\
    \ '+m.concurrencyCeiling:'No recorded limits.');list('performance',d.snapshot.performance);list('gaps',d.snapshot.gaps);}catch(e){put('error',e.message);}}\n\
    document.getElementById('refresh').addEventListener('click',refresh);refresh().then(async()=>{try{const r=await\
    \ fetch('/api/admin/summary',{cache:'no-store'});const d=await r.json();put('audit','Recent main/legacy access\
    \ events: '+d.audit.recentEvents+' · Write failures since gateway start: '+d.audit.failuresSinceStart+' · Legacy\
    \ projection observed at: '+(d.audit.legacy?.observedAt||'not available'));}catch{put('audit','Audit status\
    \ unavailable.');}});\n</script></html>`;\n}\n\n// A gateway can route an authenticated session to a dedicated\
    \ execution pool.\n// When these variables are absent the proxy keeps its original single-pod behaviour.\nconst\
    \ ENVIRONMENT_TARGETS = {\n  off: {\n    name: 'secure',\n    host: process.env.DSH_OFFLINE_HOST || DSH_TARGET_HOST,\n\
    \    port: Number(process.env.DSH_OFFLINE_PORT || DSH_TARGET_PORT),\n    tokenFile: process.env.DSH_OFFLINE_TOKEN_FILE\
    \ || '/tmp/dsh_token.txt',\n  },\n  on: {\n    name: 'internet',\n    host: process.env.DSH_ONLINE_HOST || DSH_TARGET_HOST,\n\
    \    port: Number(process.env.DSH_ONLINE_PORT || DSH_TARGET_PORT),\n    tokenFile: process.env.DSH_ONLINE_TOKEN_FILE\
    \ || '/tmp/dsh_token.txt',\n  },\n};\n\n// Provisioned by an operator. No request header, URL, or form can choose\
    \ a host.\n// Enabling isolation makes missing identities fail closed rather than share a pool.\nconst USER_TARGETS\
    \ = process.env.DSH_USER_TARGETS_FILE\n  ? JSON.parse(fs.readFileSync(process.env.DSH_USER_TARGETS_FILE, 'utf8'))\
    \ : null;\n// Pilot accounts are provisioned by an administrator. Isolated routing always\n// disables registration,\
    \ including when a legacy opt-in variable is present.\nconst LEGACY_OWNER = !USER_TARGETS ? (process.env.DSH_SINGLE_USER\
    \ || process.env.AUTH_USER || '') : '';\nconst LEGACY_INTERNET_ONLY = !USER_TARGETS && Boolean(process.env.AUTH_USER);\n\
    const ALLOW_REGISTRATION = !USER_TARGETS && !LEGACY_OWNER && process.env.DSH_ALLOW_REGISTRATION === 'true';\n\
    if (USER_TARGETS) {\n  for (const [user, targets] of Object.entries(USER_TARGETS)) {\n    if (!/^[a-z0-9_\\\
    -.]{3,30}$/.test(user)) throw new Error('Invalid provisioned identity');\n    for (const target of Object.values(targets))\
    \ {\n      if (!target || !/^[a-zA-Z0-9.-]+$/.test(target.host) ||\n          !Number.isInteger(target.port)\
    \ || target.port < 1024 || target.port > 65535 ||\n          typeof target.tokenFile !== 'string' || !target.tokenFile.startsWith('/runtime-tokens/'))\
    \ {\n        throw new Error('Invalid provisioned runtime target');\n      }\n    }\n  }\n}\nfunction getEnvironmentTarget(mode,\
    \ user) {\n  if (USER_TARGETS) {\n    const environment = normalizeInternetMode(mode) === 'on' ? 'internet'\
    \ : 'secure';\n    const targets = Object.prototype.hasOwnProperty.call(USER_TARGETS, user) ? USER_TARGETS[user]\
    \ : null;\n    const target = targets && targets[environment];\n    return target ? { ...target, name: environment\
    \ } : null;\n  }\n  return ENVIRONMENT_TARGETS[normalizeInternetMode(mode)];\n}\n\n// The session cookie is\
    \ shared with the app subdomains (dsh-<port>.<parent>) through its Domain\n// attribute. The domain comes from\
    \ configuration, never from the request's Host header, and\n// defaults to the parent of DSH_TRUSTED_HOST (dsh.example.com\
    \ -> .example.com); a host with\n// fewer than three labels gets a host-only cookie.\nfunction getCookieDomain()\
    \ {\n  if (process.env.DSH_COOKIE_DOMAIN) {\n    const d = process.env.DSH_COOKIE_DOMAIN;\n    return d.startsWith('.')\
    \ ? `; Domain=${d}` : `; Domain=.${d}`;\n  }\n  const trusted = (process.env.DSH_TRUSTED_HOST || '').split(':')[0].toLowerCase();\n\
    \  if (!trusted || /^(\\d{1,3}\\.){3}\\d{1,3}$/.test(trusted)) return '';\n  const parts = trusted.split('.');\n\
    \  if (parts.length >= 3) {\n    return '; Domain=.' + parts.slice(1).join('.');\n  }\n  return '';\n}\n\n//\
    \ Proxy session cookies (this tenant's, the legacy dsh_auth name, and DSH's dsh-auth-*) are\n// removed before\
    \ a request reaches a user app, so an app cannot read and replay them.\nfunction stripAuthCookies(cookieHeader)\
    \ {\n  if (!cookieHeader) return '';\n  return cookieHeader.split(';').map(c => c.trim()).filter(c => c &&\n\
    \    !c.startsWith(`${COOKIE_NAME}=`) && !c.startsWith('dsh_auth=') && !c.startsWith('dsh-auth-')).join('; ');\n\
    }\n\n// In-memory sessions\nconst SESSIONS = new Map();\nconst cachedDshAuthCookies = new Map();\n\n// --- DYNAMIC\
    \ APP GATEWAY HELPERS (OPTION 1 & OPTION 2) ---\nfunction resolvePortAlias(alias) {\n  if (!alias) return null;\n\
    \  const key = alias.toLowerCase();\n  try {\n    const portsPath = '/workspace/.ports.json';\n    if (fs.existsSync(portsPath))\
    \ {\n      const mapping = JSON.parse(fs.readFileSync(portsPath, 'utf8'));\n      if (mapping && mapping[key])\
    \ {\n        return parseInt(mapping[key], 10);\n      }\n    }\n  } catch (e) {\n    console.error('[AUTH-PROXY]\
    \ Error reading .ports.json:', e.message);\n  }\n  const defaults = {\n    'terminal': 7681,\n    'ttyd': 7681,\n\
    \    'streamlit': 8501,\n    'dashboard': 8501,\n    'api': 8000,\n    'fastapi': 8000,\n    'web': 3000\n \
    \ };\n  return defaults[key] || null;\n}\n\nfunction parseAppTarget(inHost, reqUrl) {\n  const parsed = url.parse(reqUrl,\
    \ true);\n  let port = null;\n  let targetPath = reqUrl;\n\n  // 1. Subdomain Check: e.g. dsh-8000.example.com,\
    \ dsh2-8501, dsh-user2-8000...\n  // dsh-user<N> is tried before dsh<N> so dsh-user2-8000 resolves to port 8000,\
    \ not alias \"user2-8000\".\n  const subMatch = inHost.match(/^(?:dsh-user[0-9]*|dsh[0-9]*)-([a-zA-Z0-9_-]+)\\\
    ./i);\n  if (subMatch) {\n    const raw = subMatch[1];\n    if (/^\\d+$/.test(raw)) {\n      port = parseInt(raw,\
    \ 10);\n    } else {\n      port = resolvePortAlias(raw);\n    }\n    targetPath = reqUrl; // Root path preserved\
    \ for SPA / assets\n  }\n\n  // 2. Path Check: e.g. /proxy/8000/ or /proxy/myapp/api\n  if (!port) {\n    const\
    \ pathMatch = parsed.pathname.match(/^\\/proxy\\/([a-zA-Z0-9_-]+)(\\/.*)?$/);\n    if (pathMatch) {\n      const\
    \ raw = pathMatch[1];\n      if (/^\\d+$/.test(raw)) {\n        port = parseInt(raw, 10);\n      } else {\n\
    \        port = resolvePortAlias(raw);\n      }\n      targetPath = (pathMatch[2] || '/') + (parsed.search ||\
    \ '');\n    }\n  }\n\n  // Only user app ports are forwarded; the gateway and DSH ports are never app targets.\n\
    \  if (!Number.isInteger(port) || port < 1 || port > 65535 || port === PROXY_PORT || port === DSH_TARGET_PORT)\
    \ {\n    port = null;\n  }\n  return { port, targetPath };\n}\n\nfunction forwardToLocalApp(targetPort, targetPath,\
    \ req, res, targetHost = '127.0.0.1') {\n  const proxyHeaders = { ...req.headers };\n  proxyHeaders['host']\
    \ = `127.0.0.1:${targetPort}`;\n  proxyHeaders['x-forwarded-host'] = req.headers.host;\n  const appCookies =\
    \ stripAuthCookies(req.headers.cookie);\n  if (appCookies) {\n    proxyHeaders['cookie'] = appCookies;\n  }\
    \ else {\n    delete proxyHeaders['cookie'];\n  }\n  proxyHeaders['x-forwarded-proto'] = req.headers['x-forwarded-proto']\
    \ || 'https';\n\n  const proxyReq = http.request({\n    host: targetHost,\n    port: targetPort,\n    path:\
    \ targetPath,\n    method: req.method,\n    headers: proxyHeaders\n  }, (proxyRes) => {\n    const resHeaders\
    \ = { ...proxyRes.headers };\n    if (resHeaders['content-type'] && resHeaders['content-type'].includes('text/html'))\
    \ {\n      resHeaders['cache-control'] = 'no-cache, no-store, must-revalidate';\n      resHeaders['pragma']\
    \ = 'no-cache';\n      resHeaders['expires'] = '0';\n    }\n    res.writeHead(proxyRes.statusCode, resHeaders);\n\
    \    proxyRes.pipe(res);\n  });\n\n  proxyReq.on('error', (err) => {\n    console.warn(`[AUTH-PROXY] App forward\
    \ error on port ${targetPort}:`, err.message);\n    res.writeHead(502, { 'Content-Type': 'text/html; charset=utf-8'\
    \ });\n    res.end(`<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>DSH App Gateway: Port\
    \ ${targetPort}</title>\n  <style>\n    body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\"\
    , Roboto, sans-serif; background: #0B0F19; color: #F8FAFC; display: flex; align-items: center; justify-content:\
    \ center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }\n    .card { background: #1E293B;\
    \ border: 1px solid #334155; border-radius: 12px; padding: 32px; max-width: 540px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);\
    \ width: 100%; }\n    h2 { color: #38BDF8; margin-top: 0; display: flex; align-items: center; gap: 10px; font-size:\
    \ 20px; }\n    code { background: #0F172A; padding: 3px 8px; border-radius: 6px; color: #F43F5E; font-size:\
    \ 14px; font-family: monospace; }\n    p { color: #94A3B8; line-height: 1.6; font-size: 14px; }\n    .tip {\
    \ background: rgba(56, 189, 248, 0.1); border-left: 4px solid #38BDF8; padding: 14px 16px; margin: 20px 0; border-radius:\
    \ 0 8px 8px 0; font-size: 13px; color: #E2E8F0; }\n    .code-block { background: #0F172A; padding: 10px 14px;\
    \ border-radius: 6px; margin-top: 8px; font-family: monospace; color: #A5F3FC; font-size: 12px; }\n  </style>\n\
    </head>\n<body>\n  <div class=\"card\">\n    <h2>⚡ DSH Application Gateway</h2>\n    <p>Target service on port\
    \ <code>${targetPort}</code> is currently not listening inside this DSH container.</p>\n    <div class=\"tip\"\
    >\n      <strong>How to start your web application:</strong><br>\n      Start your server inside the DSH container\
    \ terminal or via agent, e.g.:\n      <div class=\"code-block\">python -m http.server ${targetPort}</div>\n\
    \      <div class=\"code-block\">streamlit run app.py --server.port ${targetPort}</div>\n      <div class=\"\
    code-block\">uvicorn main:app --host 0.0.0.0 --port ${targetPort}</div>\n    </div>\n    <p style=\"font-size:\
    \ 12px; color: #64748B;\">Internal status: ${err.message}</p>\n  </div>\n</body>\n</html>`);\n  });\n\n  req.pipe(proxyReq);\n\
    }\n\nfunction bindAuthenticatedProxyIdentity(req, user, internetMode) {\n  // Every carrier, including custom\
    \ applications and raw WebSocket upgrades,\n  // receives identity from the authenticated session, never the\
    \ client.\n  req.headers['x-dsh-user'] = user;\n  req.headers['x-dsh-internet-access'] = internetMode;\n  const\
    \ raw = [];\n  for (let i = 0; i < req.rawHeaders.length; i += 2) {\n    const name = req.rawHeaders[i].toLowerCase();\n\
    \    if (name !== 'x-dsh-user' && name !== 'x-dsh-internet-access') {\n      raw.push(req.rawHeaders[i], req.rawHeaders[i\
    \ + 1]);\n    }\n  }\n  raw.push('X-DSH-User', user, 'X-DSH-Internet-Access', internetMode);\n  req.rawHeaders\
    \ = raw;\n}\n\nfunction forwardWebSocketToLocalApp(targetPort, targetPath, req, socket, head, targetHost = '127.0.0.1')\
    \ {\n  const rawHeaders = req.rawHeaders;\n  let upgradeReqText = `${req.method} ${targetPath} HTTP/${req.httpVersion}\\\
    r\\n`;\n  for (let i = 0; i < rawHeaders.length; i += 2) {\n    const headerKey = rawHeaders[i];\n    let headerVal\
    \ = rawHeaders[i + 1];\n    if (headerKey.toLowerCase() === 'host') {\n      headerVal = `127.0.0.1:${targetPort}`;\n\
    \    }\n    if (headerKey.toLowerCase() === 'cookie') {\n      headerVal = stripAuthCookies(headerVal);\n  \
    \    if (!headerVal) continue;\n    }\n    upgradeReqText += `${headerKey}: ${headerVal}\\r\\n`;\n  }\n  upgradeReqText\
    \ += `\\r\\n`;\n\n  const net = require('net');\n  const targetSocket = net.connect(targetPort, targetHost,\
    \ () => {\n    targetSocket.write(upgradeReqText);\n    if (head && head.length > 0) {\n      targetSocket.write(head);\n\
    \    }\n    socket.pipe(targetSocket);\n    targetSocket.pipe(socket);\n  });\n\n  targetSocket.on('error',\
    \ (err) => {\n    console.warn(`[AUTH-PROXY] WebSocket forward error on port ${targetPort}:`, err.message);\n\
    \    socket.destroy();\n  });\n}\n\nfunction getOrMintDshCookie(clientHost, target, callback) {\n  const cacheKey\
    \ = `${target.name}|${target.host}|${target.port}|${clientHost}`;\n  const token = getDshToken(target.tokenFile);\n\
    \  if (!token) {\n    cachedDshAuthCookies.delete(cacheKey);\n    return callback(new Error(\"No DSH launch\
    \ token available\"));\n  }\n  const fingerprint = crypto.createHash('sha256').update(token).digest('hex');\n\
