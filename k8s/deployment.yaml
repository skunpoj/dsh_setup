apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh
  namespace: llm
  labels:
    app: dsh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsh
  template:
    metadata:
      labels:
        app: dsh
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: dsh
        image: ubuntu:24.04
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - |
          export DEBIAN_FRONTEND=noninteractive

          # Shutdown trap to ensure zero-loss synchronous flush to CIFS on SIGTERM/SIGINT
          cleanup() {
            echo "[SHUTDOWN-TRAP] Received termination signal, syncing sessions and storage to CIFS..."
            if [ -d /root/.dsh/sessions ] && [ -w /workspace/dsh_storage ]; then
              mkdir -p /workspace/dsh_storage/sessions 2>/dev/null || true
              cp -ru /root/.dsh/sessions/. /workspace/dsh_storage/sessions/ 2>/dev/null || true
              find /workspace/dsh_storage/sessions -name "session.lock" -delete 2>/dev/null || true
            fi
            if [ -d /root/.dsh/storages ] && [ -w /workspace/dsh_storage ]; then
              mkdir -p /workspace/dsh_storage/storages 2>/dev/null || true
              cp -ru /root/.dsh/storages/. /workspace/dsh_storage/storages/ 2>/dev/null || true
            fi
            if [ -d /root/.dsh/attachments ] && [ -w /workspace/dsh_storage ]; then
              mkdir -p /workspace/dsh_storage/attachments 2>/dev/null || true
              cp -ru /root/.dsh/attachments/. /workspace/dsh_storage/attachments/ 2>/dev/null || true
            fi
            if [ -f /root/.dsh/.credentials.yaml ] && [ -w /workspace/dsh_storage ]; then
              cp -u /root/.dsh/.credentials.yaml /workspace/dsh_storage/.credentials.yaml 2>/dev/null || true
            fi
            for p in /root/*; do
              if [ -d "$p" ] && [ ! -L "$p" ]; then
                base=$(basename "$p")
                case "$base" in
                  "workspace"|"users"|"repos"|"npm"|"dsh_setup"|".npm"|".dsh"|".cache")
                    ;;
                  *)
                    if [ -w /workspace/dsh_storage ]; then
                      mkdir -p "/workspace/dsh_storage/workspaces/$base" 2>/dev/null || true
                      cp -ru "$p/." "/workspace/dsh_storage/workspaces/$base/" 2>/dev/null || true
                    fi
                    ;;
                esac
              fi
            done
            sync || true
            echo "[SHUTDOWN-TRAP] Sync complete."
            exit 0
          }
          trap cleanup SIGTERM SIGINT

          echo "Updating apt repositories and installing packages..."
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl bash socat python3 python3-pip python3-venv python-is-python3 \
            build-essential ca-certificates jq openssl procps

          # Install Node.js 22 LTS if not already present
          if ! command -v node >/dev/null 2>&1; then
            echo "Installing Node.js 22 LTS via NodeSource..."
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y --no-install-recommends nodejs
          fi

          # Install ttyd web terminal
          if ! command -v ttyd >/dev/null 2>&1; then
            echo "Installing ttyd binary..."
            curl -fsSL -o /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 && chmod +x /usr/local/bin/ttyd || true
          fi

          # Optional: Register Custom Enterprise Root CAs if mounted
          if [ -d /usr/local/share/ca-certificates ] && [ -n "$(ls -A /usr/local/share/ca-certificates 2>/dev/null)" ]; then
            echo "Registering custom enterprise root CA certificates..."
            update-ca-certificates 2>/dev/null || true
          fi

          echo "Configuring Git Credentials..."
          git config --global http.sslVerify false
          git config --global user.name "AI Engineer"
          git config --global user.email "developer@example.com"

          # Prepare Enterprise Persistent User Workspaces and Persistence Storage
          mkdir -p /workspace/users /workspace/repos /workspace/dsh_storage/sessions /workspace/dsh_storage/storages /workspace/dsh_storage/attachments 2>/dev/null || true
          ln -s /workspace /root/workspace 2>/dev/null || true
          ln -s /workspace/users /root/users 2>/dev/null || true

          # Decouple sessions & storages from CIFS locks:
          # Keep /root/.dsh on local rootfs (supports node_modules symlinks & zero-latency file locking)
          # Restore persistent sessions & storages from CIFS to local rootfs (never symlink directly to CIFS to prevent EACCES/CIFS lock failures)
          rm -rf /root/.dsh
          mkdir -p /root/.dsh/sessions /root/.dsh/storages /root/.dsh/attachments
          if [ -d /workspace/dsh_storage/sessions ]; then
            cp -ru /workspace/dsh_storage/sessions/. /root/.dsh/sessions/ 2>/dev/null || true
            find /root/.dsh/sessions -name "session.lock" -delete 2>/dev/null || true
          fi
          if [ -d /workspace/dsh_storage/storages ]; then
            cp -ru /workspace/dsh_storage/storages/. /root/.dsh/storages/ 2>/dev/null || true
          fi
          if [ -d /workspace/dsh_storage/attachments ]; then
            cp -ru /workspace/dsh_storage/attachments/. /root/.dsh/attachments/ 2>/dev/null || true
          fi
          if [ -f /workspace/dsh_storage/.credentials.yaml ]; then
            cp /workspace/dsh_storage/.credentials.yaml /root/.dsh/.credentials.yaml 2>/dev/null || true
            chmod 600 /root/.dsh/.credentials.yaml 2>/dev/null || true
          fi

          # Ensure all user workspaces created under /root are restored/linked from CIFS upfront
          mkdir -p /workspace/dsh_storage/workspaces 2>/dev/null || true
          for d in /workspace/dsh_storage/workspaces/*; do
            if [ -d "$d" ]; then
              base=$(basename "$d")
              if [ ! -e "/root/$base" ]; then
                ln -s "$d" "/root/$base" 2>/dev/null || true
              fi
            fi
          done

          echo "Installing DSH (v4 log format supported)..."
          npm install -g --ignore-scripts @deepseek-ai/dsh@0.2.0-rc.2
          ln -sf $(which dsh 2>/dev/null) /usr/local/bin/dsh 2>/dev/null || true
          ln -sf /usr/lib/node_modules /usr/local/lib/node_modules 2>/dev/null || true

          echo "Configuring cluster LiteLLM models in DSH catalog..."
          node /scripts/configure_models.js || true

          # Persist credentials, sessions & user workspace folders back to CIFS in background watcher
          (
            while true; do
              sleep 15
              if [ -f /root/.dsh/.credentials.yaml ] && [ -w /workspace/dsh_storage ]; then
                cp -u /root/.dsh/.credentials.yaml /workspace/dsh_storage/.credentials.yaml 2>/dev/null || true
              fi
              # Sync active sessions back to CIFS storage safely without stale locks (if storage is writable)
              if [ -d /root/.dsh/sessions ] && [ -w /workspace/dsh_storage ]; then
                mkdir -p /workspace/dsh_storage/sessions 2>/dev/null || true
                cp -ru /root/.dsh/sessions/. /workspace/dsh_storage/sessions/ 2>/dev/null || true
                find /workspace/dsh_storage/sessions -name "session.lock" -delete 2>/dev/null || true
              fi
              if [ -d /root/.dsh/storages ] && [ -w /workspace/dsh_storage ]; then
                mkdir -p /workspace/dsh_storage/storages 2>/dev/null || true
                cp -ru /root/.dsh/storages/. /workspace/dsh_storage/storages/ 2>/dev/null || true
              fi
              if [ -d /root/.dsh/attachments ] && [ -w /workspace/dsh_storage ]; then
                mkdir -p /workspace/dsh_storage/attachments 2>/dev/null || true
                cp -ru /root/.dsh/attachments/. /workspace/dsh_storage/attachments/ 2>/dev/null || true
              fi
              # Sync any directory created in /root (like /root/<user>) to /workspace/dsh_storage/workspaces
              for p in /root/*; do
                if [ -d "$p" ] && [ ! -L "$p" ]; then
                  base=$(basename "$p")
                  case "$base" in
                    "workspace"|"users"|"repos"|"npm"|"dsh_setup"|".npm"|".dsh"|".cache")
                      ;;
                    *)
                      if [ -w /workspace/dsh_storage ]; then
                        mkdir -p "/workspace/dsh_storage/workspaces/$base" 2>/dev/null || true
                        cp -ru "$p/." "/workspace/dsh_storage/workspaces/$base/" 2>/dev/null || true
                      fi
                      ;;
                  esac
                fi
              done
            done
          ) &

          echo "Starting Enterprise SSO Auth Proxy on port 3080..."
          node /scripts/auth_proxy.js &

          if command -v ttyd >/dev/null 2>&1; then
            echo "Launching interactive Web Terminal (ttyd) on port 7681 (127.0.0.1)..."
            nohup ttyd -p 7681 -i 127.0.0.1 -W bash -l > /tmp/ttyd.log 2>&1 &
          fi

          # Supervised Auto-Server for Data Quality (DQ) Report on Ports 8099 & 8899
          if [ -f /workspace/dsh_storage/workspaces/Spark/site/index.html ]; then
            echo "Starting Supervised Data Quality (DQ) Report Servers on ports 8099 and 8899..."
            mkdir -p /tmp/dqsite
            cp /workspace/dsh_storage/workspaces/Spark/site/index.html /tmp/dqsite/index.html
            cp /workspace/dsh_storage/workspaces/Spark/site/index.html /tmp/dqsite/dq_report.html
            (
              while true; do
                python3 -m http.server 8099 --directory /tmp/dqsite --bind 127.0.0.1 >/dev/null 2>&1
                sleep 2
              done
            ) &
            (
              while true; do
                python3 -m http.server 8899 --directory /tmp/dqsite --bind 127.0.0.1 >/dev/null 2>&1
                sleep 2
              done
            ) &
          fi

          echo "Launching dsh web UI on port 3081 (127.0.0.1) with token logging..."
          mkfifo /tmp/dsh_fifo
          DSH_BIN=$(which dsh 2>/dev/null || ls /usr/bin/dsh /usr/local/bin/dsh 2>/dev/null | head -n1)
          node --expose-internals "$DSH_BIN" web --port 3081 --no-open --trusted-host ${DSH_TRUSTED_HOST:-dsh.aiportal.bot.or.th} > /tmp/dsh_fifo 2>&1 &
          DSH_PID=$!

          while read -r line < /tmp/dsh_fifo; do
            echo "$line"
            case "$line" in
              *"token="*)
                TOKEN=$(echo "$line" | sed -n 's/.*token=\([A-Za-z0-9_-]*\).*/\1/p')
                if [ -n "$TOKEN" ]; then
                  echo "$TOKEN" > /tmp/dsh_token.txt
                  echo "[DSH-LAUNCHER] Captured token: ${TOKEN:0:8}..."
                fi
                ;;
            esac
          done &

          wait $DSH_PID
        env:
        - name: DSH_PERMISSION_MODE
          value: danger-full-access
        - name: DEEPSEEK_BASE_URL
          value: http://litellm.llm.svc.cluster.local:4000/v1
        - name: DEEPSEEK_API_KEY
          value: sk-9d39851f559a86336c7c45f9cf18867ab24e2faa4ce70702
        - name: OPENAI_BASE_URL
          value: http://litellm.llm.svc.cluster.local:4000/v1
        - name: OPENAI_API_KEY
          value: sk-9d39851f559a86336c7c45f9cf18867ab24e2faa4ce70702
        - name: LITELLM_API_BASE
          value: http://litellm.llm.svc.cluster.local:4000/v1
        - name: LITELLM_API_KEY
          value: sk-9d39851f559a86336c7c45f9cf18867ab24e2faa4ce70702
        - name: DSH_TRUSTED_HOST
          value: dsh.aiportal.bot.or.th
        - name: DSH_COOKIE_NAME
          value: dsh_auth
        ports:
        - containerPort: 3080
          name: auth-proxy
        - containerPort: 3081
          name: dsh-web
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                echo "[PRE-STOP] Flushing sessions, storages, and attachments to CIFS..."
                if [ -d /root/.dsh/sessions ] && [ -w /workspace/dsh_storage ]; then
                  mkdir -p /workspace/dsh_storage/sessions 2>/dev/null || true
                  cp -ru /root/.dsh/sessions/. /workspace/dsh_storage/sessions/ 2>/dev/null || true
                  find /workspace/dsh_storage/sessions -name "session.lock" -delete 2>/dev/null || true
                fi
                if [ -d /root/.dsh/storages ] && [ -w /workspace/dsh_storage ]; then
                  mkdir -p /workspace/dsh_storage/storages 2>/dev/null || true
                  cp -ru /root/.dsh/storages/. /workspace/dsh_storage/storages/ 2>/dev/null || true
                fi
                if [ -d /root/.dsh/attachments ] && [ -w /workspace/dsh_storage ]; then
                  mkdir -p /workspace/dsh_storage/attachments 2>/dev/null || true
                  cp -ru /root/.dsh/attachments/. /workspace/dsh_storage/attachments/ 2>/dev/null || true
                fi
                if [ -f /root/.dsh/.credentials.yaml ] && [ -w /workspace/dsh_storage ]; then
                  cp -u /root/.dsh/.credentials.yaml /workspace/dsh_storage/.credentials.yaml 2>/dev/null || true
                fi
                for p in /root/*; do
                  if [ -d "$p" ] && [ ! -L "$p" ]; then
                    base=$(basename "$p")
                    case "$base" in
                      "workspace"|"users"|"repos"|"npm"|"dsh_setup"|".npm"|".dsh"|".cache")
                        ;;
                      *)
                        if [ -w /workspace/dsh_storage ]; then
                          mkdir -p "/workspace/dsh_storage/workspaces/$base" 2>/dev/null || true
                          cp -ru "$p/." "/workspace/dsh_storage/workspaces/$base/" 2>/dev/null || true
                        fi
                        ;;
                    esac
                  fi
                done
                sync || true
                echo "[PRE-STOP] Final sync complete."
        volumeMounts:
        - name: workspace-storage
          mountPath: /workspace
          subPath: dsh
        - name: dsh-scripts
          mountPath: /scripts
      volumes:
      - name: workspace-storage
        persistentVolumeClaim:
          claimName: da-workspace-pvc-new
      - name: dsh-scripts
        configMap:
          name: dsh-scripts
          defaultMode: 493
