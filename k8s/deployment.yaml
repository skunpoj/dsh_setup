apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh
  namespace: llm
  labels:
    app: dsh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsh
  template:
    metadata:
      labels:
        app: dsh
    spec:
      containers:
      - name: dsh
        image: ubuntu:24.04
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - |
          export DEBIAN_FRONTEND=noninteractive
          echo "Updating apt repositories and installing packages..."
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl bash socat python3 python3-pip python3-venv python-is-python3 \
            build-essential ca-certificates jq openssl procps

          # Install Node.js 22 LTS if not already present
          if ! command -v node >/dev/null 2>&1; then
            echo "Installing Node.js 22 LTS via NodeSource..."
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y --no-install-recommends nodejs
          fi

          # Install ttyd web terminal
          if ! command -v ttyd >/dev/null 2>&1; then
            echo "Installing ttyd binary..."
            curl -fsSL -o /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 && chmod +x /usr/local/bin/ttyd || true
          fi

          # Register Bank of Thailand Internal Root CA if available
          if command -v openssl >/dev/null 2>&1; then
            echo "Checking enterprise root CA trust..."
            echo | openssl s_client -showcerts -servername ${DSH_TRUSTED_HOST:-dsh.example.com} -connect 172.22.13.54:443 2>/dev/null \
              | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/{ if(/BEGIN CERTIFICATE/) {cert++} if(cert==2) print }' \
              > /usr/local/share/ca-certificates/bot-internal-root-ca.crt 2>/dev/null || true
            if [ -s /usr/local/share/ca-certificates/bot-internal-root-ca.crt ]; then
              update-ca-certificates 2>/dev/null || true
            fi
          fi

          echo "Configuring Git Credentials..."
          git config --global http.sslVerify false
          git config --global user.name "AI Engineer"
          git config --global user.email "developer@example.com"

          # Prepare Enterprise Persistent User Workspaces and Persistence Storage
          mkdir -p /workspace/users /workspace/repos /workspace/dsh_storage/sessions /workspace/dsh_storage/storages
          ln -s /workspace /root/workspace 2>/dev/null || true
          ln -s /workspace/users /root/users 2>/dev/null || true

          # Keep /root/.dsh on local rootfs (supports node_modules symlinks)
          # but symlink sessions & storages to /workspace/dsh_storage
          rm -rf /root/.dsh
          mkdir -p /root/.dsh
          ln -s /workspace/dsh_storage/sessions /root/.dsh/sessions
          ln -s /workspace/dsh_storage/storages /root/.dsh/storages
          if [ -f /workspace/dsh_storage/.credentials.yaml ]; then
            cp /workspace/dsh_storage/.credentials.yaml /root/.dsh/.credentials.yaml
            chmod 600 /root/.dsh/.credentials.yaml
          fi

          # Ensure all user workspaces created under /root are restored/linked from CIFS upfront
          mkdir -p /workspace/dsh_storage/workspaces
          for d in /workspace/dsh_storage/workspaces/*; do
            if [ -d "$d" ]; then
              base=$(basename "$d")
              if [ ! -e "/root/$base" ]; then
                ln -s "$d" "/root/$base" 2>/dev/null || true
              fi
            fi
          done

          echo "Installing DSH..."
          npm install -g --ignore-scripts @deepseek-ai/dsh@0.1.5-rc.3

          echo "Configuring cluster LiteLLM models in DSH catalog..."
          node /scripts/configure_models.js || true

          # Persist credentials & user workspace folders back to CIFS in background watcher
          (
            while true; do
              sleep 10
              if [ -f /root/.dsh/.credentials.yaml ]; then
                cp -u /root/.dsh/.credentials.yaml /workspace/dsh_storage/.credentials.yaml 2>/dev/null || true
              fi
              # Sync any directory created in /root (like /root/<user>) to /workspace/dsh_storage/workspaces
              for p in /root/*; do
                if [ -d "$p" ] && [ ! -L "$p" ]; then
                  base=$(basename "$p")
                  case "$base" in
                    "workspace"|"users"|"repos"|"npm"|"dsh_setup"|".npm"|".dsh"|".cache")
                      ;;
                    *)
                      mkdir -p "/workspace/dsh_storage/workspaces/$base"
                      cp -ru "$p/." "/workspace/dsh_storage/workspaces/$base/" 2>/dev/null || true
                      ;;
                  esac
                fi
              done
            done
          ) &

          echo "Starting Enterprise SSO Auth Proxy on port 3080..."
          node /scripts/auth_proxy.js &

          if command -v ttyd >/dev/null 2>&1; then
            echo "Launching interactive Web Terminal (ttyd) on port 7681 (127.0.0.1)..."
            nohup ttyd -p 7681 -i 127.0.0.1 -W bash -l > /tmp/ttyd.log 2>&1 &
          fi

          echo "Launching dsh web UI on port 3081 (127.0.0.1) with token logging..."
          mkfifo /tmp/dsh_fifo
          node --expose-internals /usr/local/bin/dsh web --port 3081 --no-open --trusted-host ${DSH_TRUSTED_HOST:-dsh.example.com} > /tmp/dsh_fifo 2>&1 &
          DSH_PID=$!

          while read -r line < /tmp/dsh_fifo; do
            echo "$line"
            case "$line" in
              *"token="*)
                TOKEN=$(echo "$line" | sed -n 's/.*token=\([A-Za-z0-9_-]*\).*/\1/p')
                if [ -n "$TOKEN" ]; then
                  echo "$TOKEN" > /tmp/dsh_token.txt
                  echo "[DSH-LAUNCHER] Captured token: ${TOKEN:0:8}..."
                fi
                ;;
            esac
          done &

          wait $DSH_PID
        env:
        # Public host of this DSH instance: used by `dsh web --trusted-host` and for the app links in AGENTS.md
        - name: DSH_TRUSTED_HOST
          value: dsh.example.com
        - name: DSH_COOKIE_NAME
          value: dsh_auth
        - name: DSH_AUTH_PASS
          valueFrom:
            secretKeyRef:
              name: dsh-auth
              key: admin-password
        - name: DEEPSEEK_BASE_URL
          value: http://litellm.llm.svc.cluster.local:4000/v1
        - name: DEEPSEEK_API_KEY
          value: sk-your-litellm-cluster-key
        - name: OPENAI_BASE_URL
          value: http://litellm.llm.svc.cluster.local:4000/v1
        - name: OPENAI_API_KEY
          value: sk-your-litellm-cluster-key
        - name: LITELLM_API_BASE
          value: http://litellm.llm.svc.cluster.local:4000/v1
        - name: LITELLM_API_KEY
          value: sk-your-litellm-cluster-key
        ports:
        - containerPort: 3080
          name: auth-proxy
        - containerPort: 3081
          name: dsh-web
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        volumeMounts:
        - name: workspace-storage
          mountPath: /workspace
        - name: dsh-scripts
          mountPath: /scripts
      volumes:
      - name: workspace-storage
        persistentVolumeClaim:
          claimName: dsh-workspace-pvc
      - name: dsh-scripts
        configMap:
          name: dsh-scripts
          defaultMode: 493
