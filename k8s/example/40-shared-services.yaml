---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai-workspace-example
  annotations:
    ai-workspace/reference-only: Render local configuration before applying; documentation
      addresses are reserved.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm@sha256:4870893763aca143f590bd5685a25219037af027d1d27e97abcb17ac9ec5d09f
        command:
        - litellm
        args:
        - --config
        - /etc/litellm/config.yaml
        - --port
        - '4000'
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: LITELLM_MASTER_KEY
        - name: LITELLM_SALT_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: LITELLM_SALT_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: DATABASE_URL
        - name: PYTHONPATH
          value: /etc/litellm
        volumeMounts: &id001
        - name: source
          mountPath: /etc/litellm
          readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '4'
            memory: 4Gi
        startupProbe:
          tcpSocket:
            port: 4000
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          tcpSocket:
            port: 4000
      - name: context-forwarder
        image: ghcr.io/berriai/litellm@sha256:4870893763aca143f590bd5685a25219037af027d1d27e97abcb17ac9ec5d09f
        command:
        - python
        - -m
        - uvicorn
        - context_forwarder:app
        - --app-dir
        - /etc/litellm
        - --host
        - 127.0.0.1
        - --port
        - '4001'
        env:
        - name: PYTHONPATH
          value: /etc/litellm
        - name: HOME
          value: /tmp
        - name: DSH_TOKENIZER_URL
          value: http://model:8000/v1/tokenize
        volumeMounts: *id001
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/health',timeout=2).read()
          periodSeconds: 10
      volumes:
      - name: source
        configMap:
          name: gateway-source
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 192.0.2.54
        searches:
        - ai-workspace-example.svc.cluster.local
        - svc.cluster.local
        - cluster.local
        options:
        - name: ndots
          value: '1'
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-workspace-example
  annotations:
    ai-workspace/reference-only: Render local configuration before applying; documentation
      addresses are reserved.
spec:
  selector:
    app: litellm
  ports:
  - port: 4000
    targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ai-workspace-example
  annotations:
    ai-workspace/reference-only: Render local configuration before applying; documentation
      addresses are reserved.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: registry.example.com/ai-workspace@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        command:
        - node
        - /opt/dsh/scripts/auth_proxy.js
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: DSH_USER_TARGETS_FILE
          value: /routing/users.json
        - name: DSH_USER_STORE_PATH
          value: /auth/users.json
        - name: DSH_USER_SETTINGS_PATH
          value: /auth/settings.json
        - name: DSH_AUDIT_DIR
          value: /auth/audit
        - name: DSH_ADMIN_USERS
          value: admin
        - name: DSH_TRUSTED_HOST
          value: workspace.example.com
        - name: DSH_ALLOW_REGISTRATION
          value: 'false'
        - name: PORT
          value: '3080'
        volumeMounts:
        - name: auth
          mountPath: /auth
        - name: routing
          mountPath: /routing
          readOnly: true
        - name: tokens
          mountPath: /runtime-tokens
          readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 3080
      volumes:
      - name: auth
        persistentVolumeClaim:
          claimName: gateway-auth
      - name: routing
        configMap:
          name: user-routing
      - name: tokens
        persistentVolumeClaim:
          claimName: routing-tokens
      - name: seed
        secret:
          secretName: account-seed
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 192.0.2.54
        searches:
        - ai-workspace-example.svc.cluster.local
        - svc.cluster.local
        - cluster.local
        options:
        - name: ndots
          value: '1'
      initContainers:
      - name: initialize-account-store
        image: registry.example.com/ai-workspace@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        command:
        - sh
        - -ec
        - mkdir -p /auth; if [ ! -f /auth/users.json ]; then cp /seed/users.json /auth/users.json;
          fi; chmod 0600 /auth/users.json; chown -R 10001:10001 /auth; mkdir -p /tokens/8c6976e5b5410415/secure;
          chown 10001:10001 /tokens/8c6976e5b5410415/secure; mkdir -p /tokens/8c6976e5b5410415/internet;
          chown 10001:10001 /tokens/8c6976e5b5410415/internet; mkdir -p /tokens/2a97516c354b6884/secure;
          chown 10001:10001 /tokens/2a97516c354b6884/secure; mkdir -p /tokens/2a97516c354b6884/internet;
          chown 10001:10001 /tokens/2a97516c354b6884/internet
        volumeMounts:
        - name: auth
          mountPath: /auth
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: tokens
          mountPath: /tokens
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ai-workspace-example
  annotations:
    ai-workspace/reference-only: Render local configuration before applying; documentation
      addresses are reserved.
spec:
  selector:
    app: gateway
  ports:
  - port: 3080
    targetPort: 3080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: ai-workspace-example
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    ai-workspace/reference-only: Render local configuration before applying; documentation
      addresses are reserved.
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - workspace.example.com
    secretName: workspace-tls
  rules:
  - host: workspace.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 3080
