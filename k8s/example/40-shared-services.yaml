data:
  context_forwarder.py: "\"\"\"Loopback-only final-wire 1M guard between LiteLLM and\
    \ internal SGLang.\n\nBind to 127.0.0.1 in the authenticated LiteLLM pod. Never\
    \ expose this listener\nas a Service. Prompts/keys are not logged. Only canaries\
    \ may enable capture.\n\"\"\"\nimport asyncio\nimport contextlib\nimport json\n\
    import os\nfrom pathlib import Path\nimport time\nimport uuid\n\nimport httpx\n\
    from fastapi import FastAPI, HTTPException, Request\nfrom fastapi.responses import\
    \ JSONResponse, StreamingResponse\nfrom starlette.background import BackgroundTask\n\
    \nfrom long_context_callbacks import CONTEXT, OUTPUT, RESERVE, TOKENIZER, LongContextGuard,\
    \ count_request\nfrom context_envelope import normalize_conditioning\n\napp =\
    \ FastAPI(docs_url=None, redoc_url=None, openapi_url=None)\nclass InteractiveLane:\n\
    \    \"\"\"Let ordinary streams drain between bounded long-prefill steps.\n\n\
    \    Long work gets a step after at most 8s of uninterrupted foreground load;\n\
    \    this is cooperative scheduling, not GPU preemption or a latency SLA.\n  \
    \  \"\"\"\n    def __init__(self, maximum_pause=8):\n        self.active = 0\n\
    \        self.idle = asyncio.Event()\n        self.idle.set()\n        self.maximum_pause\
    \ = maximum_pause\n\n    def enter(self):\n        self.active += 1\n        self.idle.clear()\n\
    \n    def leave(self):\n        if self.active < 1:\n            raise RuntimeError('Interactive\
    \ lane released without ownership')\n        self.active -= 1\n        if not\
    \ self.active:\n            self.idle.set()\n\n    async def wait_turn(self):\n\
    \        start = time.monotonic()\n        if self.active:\n            try:\n\
    \                await asyncio.wait_for(self.idle.wait(), timeout=self.maximum_pause)\n\
    \            except asyncio.TimeoutError:\n                pass\n        return\
    \ time.monotonic() - start\n\n\ninteractive = InteractiveLane()\nguard = LongContextGuard()\n\
    guard.before_warm_step = interactive.wait_turn\nBACKEND = TOKENIZER.removesuffix('/v1/tokenize')\n\
    \n\ndef assemble_response(chunks, messages):\n    from litellm import ModelResponseStream,\
    \ stream_chunk_builder\n    result = stream_chunk_builder([ModelResponseStream(**c)\
    \ for c in chunks], messages=messages)\n    if result is None:\n        raise\
    \ HTTPException(503, 'No complete model response was received.')\n    return result.model_dump(mode='json')\n\
    \n\nasync def abort(rid):\n    try:\n        async with httpx.AsyncClient(timeout=5,\
    \ trust_env=False) as client:\n            await client.post(BACKEND+'/abort_request',\
    \ json={'rid': rid})\n    except Exception:\n        pass\n\n\nasync def watch_client(request,\
    \ coroutine):\n    task = asyncio.create_task(coroutine)\n    try:\n        while\
    \ not task.done():\n            await asyncio.wait({task}, timeout=.5)\n     \
    \       if await request.is_disconnected():\n                raise HTTPException(499,\
    \ 'Client disconnected.')\n        return await task\n    finally:\n        if\
    \ not task.done():\n            task.cancel()\n            with contextlib.suppress(asyncio.CancelledError):\n\
    \                await task\n\n\n@app.get('/health')\nasync def health():\n  \
    \  return {'context': CONTEXT, 'output': OUTPUT, 'finalWireGuard': True}\n\n\n\
    @app.get('/v1/models')\nasync def models():\n    async with httpx.AsyncClient(timeout=10,\
    \ trust_env=False) as client:\n        response = await client.get(BACKEND+'/v1/models')\n\
    \        return JSONResponse(response.json(), status_code=response.status_code)\n\
    \n\n@app.post('/v1/chat/completions')\nasync def completion(request: Request):\n\
    \    raw = bytearray()\n    async for part in request.stream():\n        raw.extend(part)\n\
    \        if len(raw) > 64*1024*1024:\n            raise HTTPException(413, 'Request\
    \ body exceeds the supported envelope.')\n    try:\n        data = json.loads(raw)\n\
    \    except Exception:\n        raise HTTPException(400, 'Invalid JSON.')\n  \
    \  if not isinstance(data, dict) or not isinstance(data.get('messages'), list):\n\
    \        raise HTTPException(400, 'Chat messages required.')\n    if data.get('model')\
    \ not in ['deepseek-v4.1-flash', 'deepseek-flash']:\n        raise HTTPException(400,\
    \ 'Model is outside this context policy.')\n    normalize_conditioning(data)\n\
    \    if os.environ.get('DSH_CAPTURE_SYNTHETIC_ENVELOPE') == '1':\n        Path('/tmp/dsh-synthetic-envelope.json').write_text(json.dumps(data))\n\
    \    try:\n        tokenized = await asyncio.to_thread(count_request, data, True)\n\
    \    except Exception:\n        raise HTTPException(503, 'Final-wire token budgeting\
    \ unavailable; not dispatched.')\n    available = CONTEXT-RESERVE-tokenized['count']\n\
    \    if available < 1:\n        raise HTTPException(400, 'Input exceeds 1M total-token\
    \ budget; compact or reduce it.')\n    limits = [data[k] for k in ['max_tokens',\
    \ 'max_completion_tokens'] if k in data]\n    if any(type(n) is not int or n <\
    \ 1 for n in limits):\n        raise HTTPException(400, 'Invalid output budget.')\n\
    \    data.pop('max_completion_tokens', None)\n    data['max_tokens'] = min([OUTPUT,\
    \ available]+limits)\n    long = tokenized['count']+data['max_tokens'] > 131072\n\
    \    non_text = any(isinstance(m.get('content'), list) and any(\n        isinstance(part,\
    \ dict) and part.get('type') != 'text' for part in m['content'])\n        for\
    \ m in data['messages'] if isinstance(m, dict))\n    if long and non_text:\n \
    \       raise HTTPException(400, 'Above 128K, this warming route supports text\
    \ and tools; reduce multimodal input.')\n    incoming_stream = bool(data.get('stream'))\n\
    \    if long and not incoming_stream and any(data.get(k) for k in\n        ['return_token_ids',\
    \ 'return_prompt_token_ids', 'return_meta_info', 'return_hidden_states']):\n \
    \       raise HTTPException(400, 'Large nonstreaming requests do not support raw\
    \ backend debug metadata.')\n    lease = {'metadata': {}}\n    rid = 'dsh-final-'+uuid.uuid4().hex\n\
    \    data['rid'] = rid\n    client = None\n    upstream = None\n    handed_off\
    \ = False\n    cleaned = False\n    ordinary_owned = False\n    async def cleanup():\n\
    \        nonlocal cleaned, ordinary_owned\n        if cleaned:\n            return\n\
    \        cleaned = True\n        if ordinary_owned:\n            interactive.leave()\n\
    \            ordinary_owned = False\n        try:\n            if upstream is\
    \ not None:\n                await upstream.aclose()\n            if client is\
    \ not None:\n                await client.aclose()\n            await abort(rid)\n\
    \        finally:\n            guard.release(lease)\n    try:\n        if not\
    \ long:\n            interactive.enter()\n            ordinary_owned = True\n\
    \        if long:\n            key = uuid.uuid4().hex\n            lease['metadata']['dsh_long_lease']\
    \ = key\n            async def prepare():\n                await guard.acquire(key)\n\
    \                summary = await guard.warm(tokenized['tokens'])\n           \
    \     print(json.dumps({'event': 'dsh_final_wire_warmed', **summary}), flush=True)\n\
    \            try:\n                await watch_client(request, prepare())\n  \
    \          except HTTPException:\n                raise\n            except Exception:\n\
    \                raise HTTPException(503, 'Long-context cache preparation stopped;\
    \ retry later.')\n        client = httpx.AsyncClient(timeout=httpx.Timeout(3600,\
    \ connect=10), trust_env=False)\n        wire_data = dict(data)\n        if long\
    \ and not incoming_stream:\n            wire_data['stream'] = True\n         \
    \   wire_data['stream_options'] = {**(data.get('stream_options') or {}), 'include_usage':\
    \ True}\n        upstream = await client.send(client.build_request('POST', BACKEND+'/v1/chat/completions',\
    \ json=wire_data), stream=True)\n        if upstream.status_code != 200 or (not\
    \ long and not incoming_stream):\n            body = await upstream.aread()\n\
    \            return JSONResponse(json.loads(body), status_code=upstream.status_code)\n\
    \n        async def stream():\n            iterator = upstream.aiter_raw().__aiter__()\n\
    \            first = not long\n            deadline = time.monotonic()+15\n  \
    \          buffer = b''\n            try:\n                while True:\n     \
    \               remaining = deadline-time.monotonic() if not first else 3600\n\
    \                    if remaining <= 0:\n                        raise TimeoutError('Cache\
    \ handoff did not produce output')\n                    try:\n               \
    \         chunk = await asyncio.wait_for(anext(iterator), timeout=remaining)\n\
    \                    except StopAsyncIteration:\n                        break\n\
    \                    if not first:\n                        buffer += chunk\n\
    \                        while b'\\n' in buffer:\n                           \
    \ line, buffer = buffer.split(b'\\n', 1)\n                            if line.startswith(b'data:\
    \ ') and line[6:].strip() != b'[DONE]':\n                                try:\n\
    \                                    item = json.loads(line[6:])\n           \
    \                         first = first or any(any(c.get('delta', {}).get(k) for\
    \ k in\n                                        ['content', 'reasoning_content',\
    \ 'tool_calls']) for c in item.get('choices', []))\n                         \
    \       except Exception:\n                                    pass\n        \
    \            yield chunk\n            except (TimeoutError, httpx.TimeoutException):\n\
    \                yield b'data: '+json.dumps({'error': {'code': 'context_cache_handoff_failed',\n\
    \                    'message': 'Long-context cache handoff failed; request stopped\
    \ without full-prefill fallback.'}}).encode()+b'\\n\\n'\n            finally:\n\
    \                await asyncio.shield(cleanup())\n        if not incoming_stream:\n\
    \            async def collect():\n                packets = []\n            \
    \    buffer = b''\n                async for chunk in stream():\n            \
    \        buffer += chunk\n                    while b'\\n' in buffer:\n      \
    \                  line, buffer = buffer.split(b'\\n', 1)\n                  \
    \      if not line.startswith(b'data: ') or line[6:].strip() == b'[DONE]':\n \
    \                           continue\n                        packet = json.loads(line[6:])\n\
    \                        if 'error' in packet:\n                            raise\
    \ HTTPException(503, 'Long-context response stopped before completion.')\n   \
    \                     packets.append(packet)\n                return assemble_response(packets,\
    \ data['messages'])\n            return JSONResponse(await watch_client(request,\
    \ collect()))\n        handed_off = True\n        return StreamingResponse(stream(),\
    \ media_type='text/event-stream', headers={'Cache-Control': 'no-cache'},\n   \
    \                              background=BackgroundTask(cleanup))\n    finally:\n\
    \        if not handed_off:\n            await asyncio.shield(cleanup())\n"
  context_envelope.py: "\"\"\"Make prompt-affecting SGLang defaults explicit on both\
    \ code paths.\"\"\"\n\n\ndef normalize_conditioning(data):\n    data.setdefault('continue_final_message',\
    \ False)\n    for tool in data.get('tools') or []:\n        if isinstance(tool,\
    \ dict) and tool.get('type') == 'function':\n            function = tool.get('function')\n\
    \            if isinstance(function, dict) and function.get('strict') is None:\n\
    \                # The pinned TokenizeRequest converter materializes this\n  \
    \              # default. Forward it too so actual prompt IDs are identical.\n\
    \                function['strict'] = False\n    return data\n"
  long_context_callbacks.py: "\"\"\"Exact backend budgeting and one-at-a-time long-prefill\
    \ admission.\n\nRun in one LiteLLM replica. The process-shared flock remains held\
    \ until the\nstream closes, including cancellation/failure. Ordinary requests\
    \ do not wait\non this lock. No prompt content or credentials are logged.\n\"\"\
    \"\nimport asyncio\nimport fcntl\nimport json\nimport os\nimport time\nimport\
    \ urllib.request\nimport urllib.error\nimport uuid\n\nfrom fastapi import HTTPException\n\
    from litellm.integrations.custom_logger import CustomLogger\n\nCONTEXT = 1048576\n\
    OUTPUT = 8192\nRESERVE = 256\nLONG_THRESHOLD = 131072\nMODELS = {'deepseek-v4.1-flash',\
    \ 'deepseek-flash'}\nTOKENIZER = os.environ.get('DSH_TOKENIZER_URL',\n    'http://model:8000/v1/tokenize')\n\
    WARM_STEP = 2048\nCACHE_PROBE_SECONDS = 2\n\n\nclass CacheProbeMiss(TimeoutError):\n\
    \    \"\"\"The bounded cache probe was cold and its own request was aborted.\"\
    \"\"\n\n\ndef count_request(data, final_envelope=False):\n    allowed = ('messages',\
    \ 'tools', 'tool_choice', 'reasoning_effort',\n               'continue_final_message',\
    \ 'chat_template_kwargs')\n    payload = dict(data) if final_envelope else {k:\
    \ data[k] for k in allowed if k in data}\n    if final_envelope:\n        # Tokenization\
    \ has no streaming transport. Preserve every conditioning\n        # field from\
    \ the final wire payload, excluding only SSE output controls.\n        payload['stream']\
    \ = False\n        payload.pop('stream_options', None)\n    payload['model'] =\
    \ 'deepseek-v4.1-flash'\n    req = urllib.request.Request(TOKENIZER, data=json.dumps(payload).encode(),\n\
    \        headers={'Content-Type': 'application/json'})\n    try:\n        with\
    \ urllib.request.build_opener(urllib.request.ProxyHandler({})).open(req, timeout=120)\
    \ as response:\n            result = json.load(response)\n    except urllib.error.HTTPError\
    \ as error:\n        # Debug only validation locations/types, never the rejected\
