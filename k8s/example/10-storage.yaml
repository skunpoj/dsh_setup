apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: ai-workspace-example
  annotations:
    ai-workspace/reference-only: Render local configuration before applying; documentation
      addresses are reserved.
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: operator-rwo
  resources:
    requests:
      storage: 2Ti
