apiVersion: batch/v1
kind: Job
metadata:
  name: dsh-migrate-secure-state
  namespace: llm
spec:
  # Resume only during the controlled environment-pool rollout.
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels: { app: dsh-auth-migration }
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ubuntu:24.04
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              for file in .user_auth.json .user_settings.json; do
                if [ -f "/source/users/$file" ]; then
                  install -m 0600 "/source/users/$file" "/auth/$file"
                fi
              done
              (cd /source && tar --exclude=users --exclude=dsh_storage -cf - .) | (cd /workspace && tar -xf -)
              chown -R 10001:10001 /auth /workspace
              test -s /auth/.user_auth.json
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN, FOWNER, DAC_OVERRIDE] }
          volumeMounts:
            - { name: legacy-state, mountPath: /source, subPath: dsh, readOnly: true }
            - { name: auth-state, mountPath: /auth }
            - { name: secure-workspace, mountPath: /workspace }
      volumes:
        - name: legacy-state
          persistentVolumeClaim: { claimName: da-workspace-pvc-new }
        - name: auth-state
          persistentVolumeClaim: { claimName: dsh-auth-state }
        - name: secure-workspace
          persistentVolumeClaim: { claimName: dsh-secure-workspace }
