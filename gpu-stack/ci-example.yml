name: Portable GPU stack qualification
on:
  push:
    paths:
      - 'gpu-stack/**'
      - 'scripts/context_forwarder.py'
      - 'scripts/context_envelope.py'
      - 'scripts/long_context_callbacks.py'
      - 'scripts/gateway_output_guard.py'
      - '.github/workflows/portable-gpu.yml'
  pull_request:
    paths:
      - 'gpu-stack/**'
      - 'scripts/context_forwarder.py'
      - 'scripts/context_envelope.py'
      - 'scripts/long_context_callbacks.py'
      - 'scripts/gateway_output_guard.py'
      - '.github/workflows/portable-gpu.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s gpu-stack/tests -v
      - run: python gpu-stack/render.py --settings gpu-stack/settings.example.json --output /tmp/gpu-candidate.yaml
