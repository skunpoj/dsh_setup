trigger:
  branches:
    include: [main]

variables:
  imageRepository: da-gpu-server/dsh-runtime
  imageTag: 0.2.0-rc.2-env-routing-$(Build.BuildId)

pool:
  name: Default

steps:
  - checkout: self
    clean: true

  - task: Docker@2
    displayName: Sign in to Harbor
    inputs:
      command: login
      containerRegistry: harbor-service-connection

  - task: Docker@2
    displayName: Build immutable DSH runtime candidate
    inputs:
      command: build
      containerRegistry: harbor-service-connection
      repository: $(imageRepository)
      dockerfile: Dockerfile
      buildContext: .
      tags: |
        $(imageTag)

  - powershell: |
      $image = "dsoreg-sm1-p1.bot.or.th/$(imageRepository):$(imageTag)"
      function Test-Candidate([string]$runtime, [string[]]$testArguments) {
        docker run --rm --entrypoint $runtime -w /opt/dsh $image @testArguments
        if ($LASTEXITCODE -ne 0) { throw "Candidate test failed: $runtime $testArguments" }
      }
      Test-Candidate node @('--check', 'scripts/auth_proxy.js')
      Test-Candidate node @('tests/test_auth_proxy_internet.js')
      Test-Candidate node @('tests/test_environment_routing.js')
      Test-Candidate node @('tests/test_user_isolation_routing.js')
      Test-Candidate node @('tests/test_internal_model_catalog.js')
      Test-Candidate python3 @('-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_package_promotion.py')
      ./tests/test_environment_manifests.ps1
    displayName: Verify gateway routing and deployment boundaries

  - task: Docker@2
    displayName: Push verified immutable DSH runtime
    inputs:
      command: push
      containerRegistry: harbor-service-connection
      repository: $(imageRepository)
      tags: |
        $(imageTag)

  - powershell: |
      Write-Host "##vso[task.setvariable variable=candidateImage;isOutput=true]dsoreg-sm1-p1.bot.or.th/$(imageRepository):$(imageTag)"
    name: publishMetadata
    displayName: Publish immutable candidate reference
